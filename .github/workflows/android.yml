name: Atelier-App bauen

on:
  push:
    branches: [app]
    paths: ['android/**', 'android-tests/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Aktuelle Fassung der Web-Apps mitliefern
        env:
          ATELIER_SCHLUESSEL: ${{ secrets.ATELIER_SCHLUESSEL }}
        run: |
          A=android/app/src/main/assets/web
          rm -rf "$A"; mkdir -p "$A"
          for br in atelier pult morgenrunde; do git fetch --depth 1 origin "$br:refs/remotes/origin/$br"; done
          mkdir -p "$A/atelier" "$A/pult" "$A/morgenrunde"
          git archive origin/atelier | tar -x -C "$A/atelier" --wildcards 'index.html' 'heute.json' 'manifest.json' 'icon*'
          git archive origin/pult | tar -x -C "$A/pult" --wildcards 'index.html' 'daten/*' 'manifest.json' 'icon*'
          git archive origin/morgenrunde morgenrunde/web | tar -x -C "$RUNNER_TEMP"
          cp -r "$RUNNER_TEMP/morgenrunde/web/." "$A/morgenrunde/"
          # Tagesdaten liegen verschlüsselt im Repo; der Test entschlüsselt sie mit dem Secret ATELIER_SCHLUESSEL
          pip install -q cryptography
          git show origin/pult:werkzeuge/geheim.py > "$RUNNER_TEMP/geheim.py"
          git show origin/pult:daten/heute.json > "$RUNNER_TEMP/heute.box.json"
          if [ -n "$ATELIER_SCHLUESSEL" ]; then
            python3 - "$RUNNER_TEMP" <<'PY'
          import json, os, sys; sys.path.insert(0, sys.argv[1]); import geheim
          box = json.load(open(sys.argv[1] + "/heute.box.json"))
          d = geheim.open_(box, os.environ["ATELIER_SCHLUESSEL"]) if "ct" in box else box
          json.dump(d, open(sys.argv[1] + "/heute.json", "w"))
          PY
            echo "DATA_DATE=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["date"])' "$RUNNER_TEMP/heute.json")" >> "$GITHUB_ENV"
            python3 android-tests/erwartung.py "$RUNNER_TEMP/heute.json" >> "$GITHUB_ENV"
            echo "MIT_DATEN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ATELIER_SCHLUESSEL fehlt: Emulator-Test ohne Tagesdaten"
            echo "DATA_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
            echo "MIT_DATEN=0" >> "$GITHUB_ENV"
          fi
          find "$A" -type f | sort

      - name: Signaturschlüssel (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.ATELIER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/atelier.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/atelier.jks" >> "$GITHUB_ENV"
            echo "Schlüssel: eigener (Secret)" > signatur.txt
          else
            echo "Schlüssel: Test-Schlüssel (kein Secret hinterlegt)" > signatur.txt
          fi

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ATELIER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATELIER_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: KVM für den Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p ausgabe
          rm -f ausgabe/test_*.png ausgabe/fehler_*.png ausgabe/ui_fehler_*.txt

      - name: Emulator-Test (Android 13, Pixel)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ATELIER_SCHLUESSEL: ${{ secrets.ATELIER_SCHLUESSEL }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android-tests/emulator_test.sh

      - name: Ergebnis ins Repo
        if: always()
        run: |
          mkdir -p ausgabe
          cp android/app/build/outputs/apk/release/app-release.apk ausgabe/atelier.apk 2>/dev/null || true
          tail -n 200 build.log > ausgabe/build.log 2>/dev/null || true
          cp signatur.txt ausgabe/ 2>/dev/null || true
          echo "Lauf ${{ github.run_number }}: ${{ job.status }} ($(date -u +%Y-%m-%dT%H:%MZ))" > ausgabe/status.txt
          tail -n 1 ausgabe/testbericht.txt >> ausgabe/status.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f ausgabe
          git commit -m "Atelier-App Lauf ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin app || true
          git push origin HEAD:app
