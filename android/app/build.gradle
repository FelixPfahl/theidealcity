plugins { id 'com.android.application' }

def code = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
def ks = System.getenv('KEYSTORE_FILE')
def env = { String n -> def v = System.getenv(n); v == null ? '' : v.trim() }

android {
    namespace 'de.theidealcity.atelier'
    compileSdk 34
    defaultConfig {
        applicationId 'de.theidealcity.atelier'
        minSdk 24
        targetSdk 34
        versionCode code
        versionName "1.0." + code
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword env('KEYSTORE_PASSWORD')
                keyAlias env('KEY_ALIAS')
                keyPassword env('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
