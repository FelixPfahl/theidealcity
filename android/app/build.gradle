plugins { id 'com.android.application' }

def code = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'de.theidealcity.atelier'
    compileSdk 34
    defaultConfig {
        applicationId 'de.theidealcity.atelier'
        minSdk 24
        targetSdk 34
        versionCode code
        versionName "1.0." + code
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword (System.getenv('KEYSTORE_PASSWORD') ?: '').trim()
                keyAlias (System.getenv('KEY_ALIAS') ?: '').trim()
                keyPassword (System.getenv('KEY_PASSWORD') ?: '').trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
