<h1>Atelier</h1>
<p>Gerade keine Verbindung und noch kein gespeicherter Stand. Sobald das Handy wieder Netz hat, auf „Erneut versuchen“ tippen.</p>
<p>Tipp: Die App morgens einmal mit Netz öffnen, dann läuft sie in der Schule auch ohne.</p>
<button onclick="window.AtelierApp ? AtelierApp.retry() : location.reload()">Erneut versuchen</button>
