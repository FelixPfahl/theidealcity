<header><div><h1 id="title">Inka</h1><div class="sub" id="subt">Dein Tag</div></div><button class="pri round" id="hinka">Inka</button></header>

<script>
"use strict";
const APPV="9.11. (Umbau: Heute, Woche, dunkel, Widget)";
/* ---------- Grundlagen ---------- */
const RAW="https://raw.githubusercontent.com/FelixPfahl/theidealcity/inka/";
const SP_CLIENT="aa813e25970f4abd874c4cb71bd7bd01";
/* Android-App (Josef 1.11.2026): läuft die Seite in der Inka-App, steuert sie Spotify über die App (window.InkaNative). */
const NAT=(window.InkaNative&&typeof window.InkaNative.isApp==="function")?window.InkaNative:null;
const WIN=(window.InkaWin&&typeof window.InkaWin.post==="function")?window.InkaWin:null;  // Windows-App (WebView2)
const AGENT_DEFAULT="agent_0201m64fk5bkfstr5gkhm6rat739";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const hm=d=>d?pad2(d.getHours())+":"+pad2(d.getMinutes()):"";
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+pad2(s%60);};
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const store={get(k,d){try{const v=localStorage.getItem("inka:"+k);return v==null?d:JSON.parse(v);}catch(_){return d;}},set(k,v){try{localStorage.setItem("inka:"+k,JSON.stringify(v));}catch(_){}}};
let toastT=null;
/* Josef 8.11.2026 (U18): Hinweise unten nur, wenn er etwas tun muss. Alles andere wandert still ins Protokoll (Mehr > Überblick > Meldungen). */
const NEED_RX=/tippen|erlaub|verbind|neu laden|Schlüssel|öffnen|gesperrt|installier|Mikrofon|Datum|fehlt|Text|Netz|wecken|Spotify neu|noch einmal/i;
const NOTES=[];
function note(m){NOTES.push({t:Date.now(),m:String(m)});if(NOTES.length>40)NOTES.shift();}
function toast(m,ms,need){note(m);if(!need&&!NEED_RX.test(String(m)))return;const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display="none";},ms||4500);}
/* Josef 2.11.2026: echte Überblendung in der Android-App. Inkas Stimme läuft über den Android-Player (ab App 1.2.0),
   der Inka weitersprechen lässt, während Spotify leise darunter startet, und die Songwechsel auch bei schlafender Seite selbst fährt.
   Dieses Objekt verhält sich für den Rest der Seite wie das Audio-Element. */
function makeNativeAudio(N){
  const et=new EventTarget(),fire=n=>et.dispatchEvent(new Event(n));
  const A={native:true,_ready:false,_dur:NaN,_vol:0.5,_rate:1,_ended:false,_seekT:null,_seekAt:0,_want:null,_wantAt:0,_load:null,_iv:null,
    addEventListener:(...a)=>et.addEventListener(...a),removeEventListener:(...a)=>et.removeEventListener(...a),dispatchEvent:e=>et.dispatchEvent(e),
    setAttribute(){},getAttribute(){return null;},
    removeAttribute(n){if(n==="src"){A._ready=false;A._dur=NaN;A._ended=false;try{N.voiceUnload();}catch(_){}}},
    load(){},
    loadShow(id,t){A._ready=false;A._ended=false;return new Promise((res,rej)=>{const to=setTimeout(()=>{A._load=null;rej(new Error("Stimme lädt nicht"));},180000);
      A._load={res:v=>{clearTimeout(to);res(v);},rej:e=>{clearTimeout(to);rej(e);}};try{N.voiceLoad(id,String(t));}catch(e){clearTimeout(to);rej(e);}});},
    play(){A._want="play";A._wantAt=Date.now();A._ended=false;if(!A._ready)return Promise.reject(Object.assign(new Error("nicht geladen"),{name:"NotSupportedError"}));
      try{N.voicePlay();}catch(e){return Promise.reject(e);}return Promise.resolve();},
    pause(){const was=!A.paused;A._want="pause";A._wantAt=Date.now();try{N.voicePause();}catch(_){}if(was)setTimeout(()=>{},0);},
    _ev(o){
      if(o.ev==="ready"){A._ready=true;A._dur=(o.dur||0)/1000;if(A._load){A._load.res(true);A._load=null;}fire("loadedmetadata");fire("canplay");return;}
      if(o.ev==="error"){if(A._load){A._load.rej(new Error(o.err||"Stimme"));A._load=null;}diag("stimme-fehler",{err:o.err||""});return;}
      if(o.ev==="play"){A._want=null;fire("play");fire("playing");clearInterval(A._iv);A._iv=setInterval(()=>{if(!A.paused)fire("timeupdate");},250);return;}
      if(o.ev==="pause"){A._want=null;clearInterval(A._iv);A._why=o.why||"";fire("timeupdate");fire("pause");return;}
      if(o.ev==="ended"){A._want=null;clearInterval(A._iv);A._ended=true;fire("timeupdate");fire("pause");fire("ended");return;}
      if(o.ev==="seek"){fire("timeupdate");return;}
      natSongEvent(o);}};
  Object.defineProperties(A,{
    currentTime:{get(){if(A._seekT!=null&&Date.now()-A._seekAt<600)return A._seekT;A._seekT=null;try{return N.voicePos()/1000;}catch(_){return 0;}},
      set(v){v=Math.max(0,+v||0);A._ended=false;A._seekT=v;A._seekAt=Date.now();try{N.voiceSeek(v*1000);}catch(_){}setTimeout(()=>fire("timeupdate"),0);}},
    paused:{get(){if(A._want&&Date.now()-A._wantAt<800)return A._want==="pause";try{return !N.voicePlaying();}catch(_){return true;}}},
    ended:{get(){return A._ended;}},
    duration:{get(){return A._dur;}},
    readyState:{get(){return A._ready?4:0;}},
    src:{get(){return A._ready?"native":"";},set(_){}},
    volume:{get(){return A._vol;},set(v){A._vol=Math.max(0,Math.min(1,+v||0));try{N.voiceVolume(A._vol);}catch(_){}}},
    playbackRate:{get(){return A._rate;},set(v){A._rate=+v||1;try{N.voiceRate(A._rate);}catch(_){}}},
    defaultPlaybackRate:{get(){return A._rate;},set(_){}},
    preservesPitch:{get(){return true;},set(_){}}});
  return A;}
const NVOICE=!!(window.InkaNative&&typeof window.InkaNative.voiceLoad==="function")&&localStorage.getItem("inka:webVoice")!=="true";
const AUD=NVOICE?makeNativeAudio(window.InkaNative):$("#aud");try{AUD.volume=JSON.parse(localStorage.getItem("inka:vol")||"0.5");}catch(_){AUD.volume=0.5;}
/* Josef 1.11.2026 11:02: "alle Stimmen einen Tick leiser, sonst lauter als die Musik". Einmalig 20 Prozent leiser (etwa 2 dB), Regler bleibt frei. */
/* Josef 1.11.2026 11:19: "die Stimmen sind alle etwas zu schnell". Abspieltempo der Sprache in der App (Tonhöhe bleibt), gilt für alle Shows. */
const RATE=()=>{const r=+store.get("rate",0.92);return r>=0.7&&r<=1.2?r:0.92;};
function applyRate(){try{AUD.defaultPlaybackRate=RATE();AUD.playbackRate=RATE();AUD.preservesPitch=true;}catch(_){}}
applyRate();["loadedmetadata","play","playing"].forEach(ev=>AUD.addEventListener(ev,()=>{if(Math.abs(AUD.playbackRate-RATE())>0.001)applyRate();}));
try{if(!localStorage.getItem("inka:volfix1")){const v=Math.max(0.2,Math.round(AUD.volume*0.8/0.05)*0.05);AUD.volume=v;localStorage.setItem("inka:vol",JSON.stringify(v));localStorage.setItem("inka:volfix1","1");}}catch(_){}
const MOBILE=/Android|iPhone|iPad/i.test(navigator.userAgent);

/* ---------- Schluessel (kommt einmal ueber den Link #k=..., bleibt im Handy) ---------- */
const KEY={raw:"",key:null};
(function(){
  const m=/[#&]k=([A-Za-z0-9_\-]{40,})/.exec(location.hash||"");
  if(m){store.set("key",m[1]);try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}}
  KEY.raw=store.get("key","");
})();
const b64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);};
async function cryptoKey(){if(KEY.key)return KEY.key;if(!KEY.raw)throw new Error("kein Schlüssel");KEY.key=await crypto.subtle.importKey("raw",b64u(KEY.raw),"AES-GCM",false,["encrypt","decrypt"]);return KEY.key;}
async function openEnv(env){const k=await cryptoKey();const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},k,b64(env.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function sealEnv(obj){const k=await cryptoKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {v:1,iv:tob64(iv),ct:tob64(ct)};}

/* ---------- Show laden ---------- */
const S={doc:null,day:"",err:"",loading:"",audioUrl:"",ch:-1,songDone:{},ended:false};
async function fetchDoc(day){
  const r=await fetch(RAW+"d/"+day+".json?t="+Date.now(),{cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error("Daten "+r.status);
  return await openEnv(await r.json());
}
/* Mehrere Shows an einem Tag (Josef 1.11.2026: Fruehstuecksshow und Fahrt-Show waehlbar). Index d/shows.json */
S.shows=[];S.dayShows=[];
async function loadIndex(){try{const r=await fetch(RAW+"d/shows.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return [];const j=await openEnv(await r.json());return Array.isArray(j.shows)?j.shows:[];}catch(_){return [];}}
function showLabel(x){const t=ymd(new Date()),m=ymd(addD(new Date(),1));const dd=new Date(x.day+"T12:00:00");
  return (x.day===t?"Heute":x.day===m?"Morgen":WD[dd.getDay()].slice(0,2)+" "+dd.getDate()+"."+(dd.getMonth()+1)+".")+" · "+showName(x)+(x.duration?" · "+Math.round(x.duration/60)+" Min":"");}
function pickShow(id){if(S.doc&&S.doc.id===id){closeSheet();return;}pauseShow();store.set("showpick",{id:id,on:ymd(new Date())});S.doc=null;
  if(S.audioUrl){URL.revokeObjectURL(S.audioUrl);S.audioUrl="";}AUD.removeAttribute("src");closeSheet();loadShow();}
function sheetArchive(){const all=S.shows.slice().sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:(a.slot||"").localeCompare(b.slot||""));
  let h='<h3>Alle Shows</h3><div class="small" style="margin-bottom:10px">Jede Show bleibt hier gespeichert. Antippen zum Abspielen; die Auswahl gilt bis heute Abend, morgen startet wieder die Show des Tages.</div>';
  if(!all.length)h+='<div class="small">Noch keine Shows im Archiv.</div>';
  let mon="";for(const x of all){const dd=new Date(x.day+"T12:00:00");const m=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][dd.getMonth()]+" "+dd.getFullYear();
    if(m!==mon){mon=m;h+='<div class="k" style="margin-top:12px">'+esc(m)+'</div>';}
    h+='<div style="display:flex;gap:6px;align-items:center;margin:6px 0"><button class="chip'+(S.doc&&S.doc.id===x.id?' on':'')+'" style="flex:1;text-align:left;margin:0" data-arch="'+esc(x.id)+'">'+esc(showLabel(x))+'</button><button class="chip" style="margin:0" data-drive="'+esc(x.id)+'" aria-label="In Drive sichern">Drive</button></div>';}
  h+='<div class="small" style="margin-top:10px">"Drive" bereitet die Show vor (Audio, Text, Songliste); beim zweiten Tippen öffnet sich das Teilen-Menü, dort Google Drive wählen.</div>';
  openSheet(h);document.querySelectorAll("[data-arch]").forEach(b=>b.onclick=()=>pickShow(b.dataset.arch));
  document.querySelectorAll("[data-drive]").forEach(b=>b.onclick=()=>driveShow(b.dataset.drive,b));}
/* Josef 1.11.2026: Shows in Google Drive ablegen. Die Dateien sind zu gross fuer die Drive-Verbindung des Sekretariats,
   deshalb uebergibt das Handy sie per Teilen-Menue an die Drive-App (erstes Tippen laedt und entschluesselt, zweites teilt). */
const DRV={};
async function driveShow(id,btn){
  if(DRV[id]&&DRV[id].files){const f=DRV[id].files;
    try{if(navigator.canShare&&navigator.canShare({files:f})){await navigator.share({files:f,title:DRV[id].title});toast("An Drive übergeben.");return;}}catch(e){if(e&&e.name==="AbortError")return;}
    for(const x of f){const a=document.createElement("a");a.href=URL.createObjectURL(x);a.download=x.name;document.body.appendChild(a);a.click();a.remove();}
    toast("Heruntergeladen. In der Drive-App hochladen.");return;}
  btn.textContent="lädt …";btn.disabled=true;

const MVG="https://www.mvg.de/api/bgw-pt/v3";
const HOME={lat:48.15582,lon:11.56154};
const D={pos:null,src:"",watch:null,near:[],trip:null,routes:[],err:"",at:0,timer:null,open:false,ride:false,chosen:null,dest:null};
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
D.locate=function(){

  diag("dep-standort-start",{});
  D.watch=navigator.geolocation.watchPosition(p=>{const first=!D.pos||D.src!=="Standort";if(first)diag("dep-standort",{acc:Math.round(p.coords.accuracy)});D.pos={lat:p.coords.latitude,lon:p.coords.longitude};D.src="Standort";if(first)D.refresh();else D.detect();},
    e=>{diag("dep-standort-fehler",{code:e&&e.code,msg:String(e&&e.message||"")});if(!D.pos||D.src!=="Standort"){D.pos=HOME;D.src="zu Hause (Standort nicht erlaubt)";D.refresh();}},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
};
D.stop=function(){if(D.watch!=null){try{navigator.geolocation.clearWatch(D.watch);}catch(_){}D.watch=null;}clearTimeout(D.timer);D.open=false;D.ride=false;D.chosen=null;render();};
D.tripNow=function(){
  const today=ymd(new Date());const tr=(S.doc&&S.doc.day===today&&Array.isArray(S.doc.trips)&&S.doc.trips.length)?S.doc.trips:((APP.data&&APP.data.trips&&APP.data.trips[today])||[]);if(!tr.length)return null;const now=Date.now();
  const list=tr.map(t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t.leave||""));if(!m)return null;const s=new Date();s.setHours(+m[1],+m[2],0,0);return {to:t.to||"",dest:t.dest||t.to||"",start:s,end:new Date(s.getTime()+(parseInt(t.minutes,10)||30)*60000)};}).filter(Boolean);
  return list.find(t=>now>=t.start-45*60000&&now<=t.end.getTime()+20*60000)||null;
};
D.refresh=async function(){
  clearTimeout(D.timer);if(!D.pos)return;
  try{
    const nb=await (await fetch(MVG+"/stations/nearby?latitude="+D.pos.lat+"&longitude="+D.pos.lon)).json();
    const st=(Array.isArray(nb)?nb:[]).filter(s=>(s.distanceInMeters||0)<=500).slice(0,5);
    const all=[];
    await Promise.all(st.map(async s=>{try{const r=await fetch(MVG+"/departures?globalId="+encodeURIComponent(s.globalId)+"&limit=6&transportTypes=UBAHN,TRAM,BUS,SBAHN");const j=await r.json();
      (Array.isArray(j)?j:[]).forEach(x=>all.push({station:s.name,m:s.distanceInMeters,label:x.label,dest:x.destination,type:x.transportType,plan:x.plannedDepartureTime,real:x.realtimeDepartureTime||x.plannedDepartureTime,delay:x.delayInMinutes||0,cancel:!!x.cancelled,rt:!!x.realtime}));}catch(_){}}));
    const now=Date.now();const walk=x=>Math.round((x.m||0)/80)*60000;
    D.near=all.filter(x=>x.real-now>walk(x)-60000&&!x.cancel).sort((a,b)=>a.real-b.real).filter((x,i,arr)=>arr.findIndex(y=>y.label===x.label&&y.dest===x.dest)===i).slice(0,3);
    D.trip=D.tripNow();D.routes=[];
    if(D.trip){if(!D.dest||D.dest.q!==D.trip.dest){const lj=await (await fetch(MVG+"/locations?query="+encodeURIComponent(D.trip.dest))).json();const hit=(lj||[]).find(x=>x.latitude)||null;D.dest=hit?{q:D.trip.dest,lat:hit.latitude,lon:hit.longitude}:null;}
      if(D.dest){const u=MVG+"/routes?"+new URLSearchParams({originLatitude:D.pos.lat,originLongitude:D.pos.lon,destinationLatitude:D.dest.lat,destinationLongitude:D.dest.lon,routingDateTime:new Date().toISOString(),routingDateTimeIsArrival:"false",transportTypes:"UBAHN,TRAM,BUS,SBAHN,BAHN"});
        const rj=await (await fetch(u)).json();D.routes=(Array.isArray(rj)?rj:[]).map(normRoute).filter(r=>r.veh).slice(0,3);}}
    D.err="";D.at=Date.now();if(!D.logged){D.logged=true;diag("dep-ergebnis",{stationen:st.length,abfahrten:all.length,top:D.near.length,trip:!!D.trip,routen:D.routes.length,src:D.src});}

};
function normRoute(r){
  const pT=s=>s?new Date(s):null;
  const parts=(r.parts||[]).map(p=>({walk:!p.line||p.line.transportType==="PEDESTRIAN",label:p.line?p.line.label:"",dir:p.line?p.line.destination:"",from:p.from.name,fromLat:p.from.latitude,fromLon:p.from.longitude,
    dep:pT(p.from.plannedDeparture),delay:p.from.departureDelayInMinutes||0,to:p.to.name,toLat:p.to.latitude,toLon:p.to.longitude,arr:pT(p.to.plannedDeparture),
    stops:(p.intermediateStops||[]).map(s=>({name:s.name,lat:s.latitude,lon:s.longitude,at:pT(s.plannedDeparture)}))}));
  const veh=parts.find(p=>!p.walk);return {parts,veh,arr:parts.length?parts[parts.length-1].arr:null,changes:Math.max(0,parts.filter(p=>!p.walk).length-1)};

D.detect=function(){
  if(!D.pos||!D.routes.length)return;const now=Date.now();
  if(!D.ride){const b=D.chosen||D.routes[0];if(b&&b.veh.dep&&now>b.veh.dep.getTime()+(b.veh.delay||0)*60000+30000&&dist(D.pos,{lat:b.veh.fromLat,lon:b.veh.fromLon})>150){D.ride=true;D.chosen=b;toast("Unterwegs: "+b.veh.label+" Richtung "+b.veh.dir);}}
  if(D.ride&&D.dest&&dist(D.pos,D.dest)<150){toast("Angekommen.");D.ride=false;D.chosen=null;}
};
function rideInfo(){
  const r=D.chosen||D.routes[0];if(!r)return null;const now=Date.now();
  const cur=r.parts.find(p=>!p.walk&&p.dep&&p.arr&&now>=p.dep.getTime()-30000&&now<=p.arr.getTime()+60000)||r.veh;
  const stops=[{name:cur.from,lat:cur.fromLat,lon:cur.fromLon,at:cur.dep}].concat(cur.stops,[{name:cur.to,lat:cur.toLat,lon:cur.toLon,at:cur.arr}]);

  if(best>400){k=0;stops.forEach((s,i)=>{if(s.at&&s.at.getTime()<=now)k=i;});}

function tl(){const c=chapters();const songs=[];let n=0,acc=0;c.forEach((x,i)=>{if(x.type==="song"){const L=songMs(n)/1000;songs.push({k:i,n,s:x.start,c:x.start+acc,L});acc+=L;n++;}});return songs;}

const QUIT=store.get("quit",{});
async function loadQuit(){const tp=topic();if(!tp)return;
  try{const r=await fetch("https://ntfy.sh/"+tp+"/json?poll=1&since=36h");const txt=await r.text();let ch=false;
    for(const line of txt.split("\n")){if(!line.trim())continue;let m;try{m=JSON.parse(line);}catch(_){continue;}if(m.event!=="message")continue;
      let body=m.message;if(m.attachment&&m.attachment.url){try{body=await (await fetch(m.attachment.url)).text();}catch(_){continue;}}
      let env;try{env=JSON.parse(body);}catch(_){continue;}if(!env.ct)continue;
      let d;try{d=await openEnv(env);}catch(_){continue;}
      if(d.from==="sekretariat"&&d.kind==="quittung"&&d.re&&!QUIT[d.re]){QUIT[d.re]={ok:d.ok!==false,text:d.text||"",t:d.t||Date.now()};ch=true;}}

function timedToday(day){
  return dayEntries(day).filter(e=>e.start&&e.kind!=="event"&&e.kind!=="birthday"&&e.kind!=="deadline"&&e.kind!=="allday")
    .concat(dayTasks(day).filter(t=>t.time).map(t=>({key:t.key,kind:"task",start:t.time,end:t.dur?fromMin(toMin(t.time)+t.dur):"",title:t.title,place:t.place||""})))
    .map(e=>Object.assign({},e,{s:toMin(e.start),e2:toMin(e.end)!=null&&toMin(e.end)>toMin(e.start)?toMin(e.end):toMin(e.start)+(e.kind==="task"?30:60)}))
    .sort((a,b)=>a.s-b.s);
}
const isHeavy=e=>e.heavy===true||(e.kind!=="fix"&&HEAVY_RX.test(e.title||""));
const isWork=e=>e.kind==="fix"||((e.kind==="plan"||e.kind==="task")&&!PAUSE_RX.test(e.title)&&!/lauf|sport|meal|einkauf|frei|alina|bruder|kino/i.test(e.title));
function rulesFor(day){
  const es=dayEntries(day),d=dOf(day).getDay(),out=[];
  const timed=es.filter(e=>e.start&&e.kind!=="event");
  if(timed.length>=3){
    [["Frühstück",/frühstück/i],["Mittag",/mittag/i],["Abendessen",/abendessen|abend.?brot/i]].forEach(([n,rx])=>out.push({n,ok:es.some(e=>rx.test(e.title))}));}
  if(d===2)out.push({n:"Meal Prep",ok:es.some(e=>/meal.?prep/i.test(e.title))});
  if(d===6||d===0){const sat=d===6?day:addDays(day,-1),sun=addDays(sat,1);
    const free=x=>!dayEntries(x).some(isWork)&&!dayTasks(x).some(t=>!PAUSE_RX.test(t.title));
    out.push({n:"freier Wochenendtag",ok:free(sat)||free(sun)});}
  return out;
}
function rulesHtml(day){const r=rulesFor(day);if(!r.length)return "";
  return '<div class="rules">'+r.map(x=>'<span class="rule'+(x.ok?" ok":"")+'">'+(x.ok?"✓":"!")+" "+esc(x.n)+'</span>').join("")+'</div>';}
function deadlineRows(limitDays){
  const A=APP.data||{},today=ymd(new Date());
  return (A.deadlines||[]).filter(d=>d.date>=today&&daysBetween(today,d.date)<=limitDays).sort((a,b)=>a.date<b.date?-1:1).map(d=>{
    const n=daysBetween(today,d.date),need=+d.need_h||0,plan=+d.planned_h||0,short=need>0&&plan<need;

}

  openSheet('<h3>'+(mode==="spaet"?"Später los":"Früher Schluss")+'</h3><label class="sl">'+(mode==="spaet"?"Ich fange an um":"Ich höre auf um")+'</label><input type="time" id="shtime" value="'+fromMin(mode==="spaet"?Math.ceil((nm+60)/15)*15:Math.floor((Math.max(nm+60,18*60))/15)*15)+'"><div id="shout"></div>');
  const calc=()=>{const t=toMin($("#shtime").value);if(t==null)return;
    const movable=items.filter(e=>(e.kind==="plan"||e.kind==="task")&&!PAUSE_RX.test(e.title)&&e.e2>nm);
    const fixed=items.filter(e=>!(e.kind==="plan"||e.kind==="task")||PAUSE_RX.test(e.title));

    const lostMin=lost.reduce((n,e)=>n+(mode==="spaet"?Math.min(e.e2,t)-Math.max(e.s,nm):e.e2-Math.max(e.s,t)),0);
    const total=movable.reduce((n,e)=>n+(e.e2-Math.max(e.s,nm)),0);
    const fixedHit=fixed.filter(e=>e.kind!=="task"&&!PAUSE_RX.test(e.title)&&(mode==="spaet"?e.s<t&&e.e2>nm:e.e2>t));
    if(!lost.length&&!fixedHit.length){$("#shout").innerHTML='<p>Passt: kein Block ist betroffen.</p>';return;}

    if(!lost.length){$("#shout").innerHTML='<div class="card warn" style="margin-top:12px"><div class="kc">Kollidiert mit festen Terminen</div>'+fixedHit.map(e=>'<div><b class="mono">'+esc(e.start)+'</b> '+esc(e.title)+'</div>').join("")+'<div class="small" style="margin-top:6px">Feste Termine verschiebt die App nicht. Planbare Blöcke passen weiter.</div></div><button class="pri wide" id="shF">Im Chat klären</button>';

    o+='<div class="k" style="margin-top:12px">Option A · Reihenfolge behalten, gleichmäßig kürzen</div><div class="small">Alle planbaren Blöcke auf '+Math.round(f*100)+' %: '+movable.map(e=>esc(e.title)+" "+durTxt(Math.max(0,Math.round((e.e2-Math.max(e.s,nm))*f/5)*5))).join(", ")+'.</div>';

  openSheet('<h3>Notiz</h3><textarea id="nz" rows="5" placeholder="Was soll festgehalten werden?"></textarea><div class="chips">'+PROJ.map(p=>'<button class="chip'+(p===DIK.tag?" on":"")+'" data-dtag="'+esc(p)+'">'+esc(p)+'</button>').join("")+'</div><button class="pri wide" id="nzgo">Senden</button>');
  $("#nzgo").onclick=()=>{const tx=$("#nz").value.trim();if(!tx){toast("Noch kein Text.",3000,true);return;}auftrag("notiz",{text:tx,tag:DIK.tag},"Notiz ("+DIK.tag+"): "+tx.slice(0,60),"");};
}

/* ---------- Reiter Woche (22a) ---------- */
function weekLoad(day){
  const W0=6*60,W1=23*60;let fix=0,art=0,oth=0;
  for(const e of timedToday(day)){if(PAUSE_RX.test(e.title))continue;const s=Math.max(W0,e.s),en=Math.min(W1,e.e2);if(en<=s)continue;const m=en-s;
    if(e.kind==="fix")fix+=m;else if(ART_RX.test(e.title))art+=m;else oth+=m;}
  const all=W1-W0;return {fix,art,oth,free:Math.max(0,all-fix-art-oth),all};
}
function renderWoche(){
  const el=$("#t-woche");const today=ymd(new Date());
  if(TAB.day){renderTag(el,TAB.day);dayNav(el);return;}
  let h='<h2>Woche</h2>';
  const dr=deadlineRows(14);if(dr.length)h+='<div class="card"><div class="k">Fristen</div>'+dr.join("")+'</div>';
  h+='<div class="card"><div class="k">Auslastung 6 bis 23 Uhr</div><div class="wcols">';
  for(let i=0;i<7;i++){const day=addDays(today,i),L=weekLoad(day),r=rulesFor(day),bad=r.filter(x=>!x.ok).length,dl=dayEntries(day).some(e=>e.kind==="deadline");
    const pc=v=>(v/L.all*100).toFixed(1)+"%";
    h+='<button class="wcol'+(i===0?" today":"")+'" data-openday="'+day+'" aria-label="'+esc(dlong(day))+'"><span class="wbar"><i class="f" style="height:'+pc(L.free)+'"></i><i class="o" style="height:'+pc(L.oth)+'"></i><i class="a" style="height:'+pc(L.art)+'"></i><i class="s" style="height:'+pc(L.fix)+'"></i></span>'+
      '<span class="wd1">'+esc(DSHORT[dOf(day).getDay()])+'</span><span class="wd2">'+dOf(day).getDate()+'.</span><span class="wfl">'+(dl?'<b class="dot">Frist</b>':"")+(bad?'<b class="bad">!</b>':'<b class="okd">✓</b>')+'</span></button>';}
  h+='</div><div class="wleg"><span><i class="s"></i>Schule</span><span><i class="a"></i>Kunst</span><span><i class="o"></i>Sonstiges</span><span><i class="f"></i>frei</span></div></div>';
  h+=filtersHtml();
  for(let i=0;i<7;i++){const day=addDays(today,i);
    const es=dayEntries(day).filter(e=>FILTER.includes(e.kind)||e.kind==="birthday"||e.kind==="deadline");
    const timed=es.filter(e=>e.start&&e.kind!=="event").sort((a,b)=>a.start<b.start?-1:1);
    const tk=FILTER.includes("task")?dayTasks(day):[];const marks=es.filter(e=>e.kind==="deadline"||e.kind==="birthday");const evs=es.filter(e=>e.kind==="event"&&FILTER.includes("event"));
    h+='<div class="wd tap" data-openday="'+day+'"><div class="wh"><b>'+(i===0?"Heute":i===1?"Morgen":esc(dlong(day).split(",")[0]))+'</b> <span class="de">'+esc(dlabel(day).split(" ")[1])+'</span>'+(marks.length?'<div class="mk">'+marks.map(m=>(m.kind==="deadline"?"Frist: ":"Geburtstag: ")+esc(m.title)).join(" · ")+'</div>':"")+'</div>'+rulesHtml(day)+
      timed.slice(0,6).map(e=>'<div class="wl k-'+e.kind+'"><b>'+esc(e.start)+'</b> '+esc(e.title)+badge(e.key)+'</div>').join("")+
      (timed.length>6?'<div class="small">+'+(timed.length-6)+' weitere</div>':"")+(tk.length?'<div class="small">'+tk.length+' Aufgabe'+(tk.length>1?"n":"")+'</div>':"")+
      (evs.length?'<div class="small">'+evs.length+' Veranstaltung'+(evs.length>1?"en":"")+' zur Auswahl</div>':"")+(!timed.length&&!tk.length&&!marks.length?'<div class="small">nichts eingetragen</div>':"")+'</div>';}
  el.innerHTML=h;
}
function dayNav(el){
  const today=ymd(new Date()),i=daysBetween(today,TAB.day);
  el.insertAdjacentHTML("afterbegin",'<div class="dnav"><button class="link" data-dshift="-1"'+(i<=0?" disabled":"")+'>‹ Vortag</button><button class="link" data-back="1">Woche</button><button class="link" data-dshift="1"'+(i>=6?" disabled":"")+'>Folgetag ›</button></div>');
  const b=el.querySelector(".back");if(b)b.remove();
  const wb=el.querySelector(".wbox");el.querySelector("h2").insertAdjacentHTML("afterend",rulesHtml(TAB.day));
}
function shiftDay(n){const today=ymd(new Date()),nd=addDays(TAB.day,n),i=daysBetween(today,nd);if(i<0||i>6)return;TAB.day=nd;vib(8);renderWoche();window.scrollTo(0,0);}

/* ---------- Mehr: Aufgaben, Projekte, Nachrichten, Unterwegs, Überblick (5a) ---------- */
function renderMehr(){const el=$("#mehr");if(MEHR.cur==="woche")MEHR.cur="aufgaben";
  const subs=[["aufgaben","Aufgaben"],["projekte","Projekte"],["nachrichten","Nachrichten"],["unterwegs","Unterwegs"],["ueberblick","Überblick"]];
  el.innerHTML='<div class="subtabs">'+subs.map(([k,n])=>'<button class="'+(MEHR.cur===k?"on":"")+'" data-sub="'+k+'">'+n+'</button>').join("")+'</div><div id="t-aufgaben"></div><div id="t-projekte"></div><div id="t-nachrichten"></div><div id="t-ueberblick"></div>';
  ["aufgaben","projekte","nachrichten","ueberblick"].forEach(k=>{$("#t-"+k).style.display=MEHR.cur===k?"block":"none";});
  if(MEHR.cur==="aufgaben")renderAufgaben();else if(MEHR.cur==="projekte")renderProjekte();else if(MEHR.cur==="nachrichten")renderNachrichten();else renderUeberblick();}
function renderProjekte(){
  const A=APP.data||{},P=A.projects||[],Q=A.questions||[];
  let h='<h2>Projekte</h2><div class="small" style="margin-bottom:12px">Aus den nächtlichen Übergaben der Projekte und der Sekretariat-Übersicht.</div>';
  if(!P.length)h+='<div class="card"><div class="small">Noch keine Projektdaten. Sie kommen mit dem nächsten Morgencheck.</div></div>';
  P.forEach(p=>{const qq=Q.filter(q=>q.from&&p.name&&q.from.toLowerCase().includes(String(p.name).toLowerCase().split(" ")[0]));
    h+='<div class="card proj"><div class="pn">'+esc(p.name)+'</div>'+(p.stand?'<div class="pl"><span class="k">Stand</span>'+esc(p.stand)+'</div>':"")+(p.next?'<div class="pl"><span class="k">Nächster Schritt</span><b>'+esc(p.next)+'</b></div>':"")+(p.frist?'<div class="pl"><span class="k">Frist</span>'+esc(p.frist)+'</div>':"")+
      (qq.length?'<div class="pl"><span class="k b">Fragen an dich</span>'+qq.map(q=>'<div>'+esc(q.q)+'</div>').join("")+'<button class="link" data-gotab="heute">auf Heute beantworten</button></div>':"")+(p.quelle?'<div class="small">'+esc(p.quelle)+'</div>':"")+'</div>';});
  $("#t-projekte").innerHTML=h;
}

/* ---------- Widget "Als Nächstes" (10a) ---------- */
function pushWidget(){
  if(!NAT||typeof NAT.widgetSet!=="function"||Date.now()-UMB.lastWidget<55000)return;UMB.lastWidget=Date.now();
  const today=ymd(new Date()),tom=addDays(today,1),items=[];
  [today,tom].forEach(d=>timedToday(d).filter(e=>!PAUSE_RX.test(e.title)).forEach(e=>items.push({d,t:e.start,e:fromMin(e.e2),title:e.title,kind:KIND[e.kind]||""})));
  const tr=((APP.data&&APP.data.trips&&APP.data.trips[today])||[]).map(t=>({d:today,leave:t.leave,to:t.to})).filter(t=>toMin(t.leave)!=null);
  const nm=new Date().getHours()*60+new Date().getMinutes();const trip=tr.find(t=>toMin(t.leave)>=nm-10)||null;
  const dl=((APP.data&&APP.data.deadlines)||[]).filter(d=>d.date>=today).sort((a,b)=>a.date<b.date?-1:1)[0];
  try{NAT.widgetSet(JSON.stringify({items,trip,deadline:dl?dlabel(dl.date)+" "+dl.title:""}));}catch(_){}
}

/* ---------- Gesten (9a): Aufgaben wischen, Tage wischen ---------- */
{const G={el:null,x:0,y:0,dx:0,lock:"",day:false};
  document.addEventListener("pointerdown",ev=>{const tk=ev.target.closest(".tk");G.day=TAB.cur==="woche"&&!!TAB.day&&!tk&&!ev.target.closest("button,input,textarea");
    if(!tk&&!G.day)return;G.el=tk;G.x=ev.clientX;G.y=ev.clientY;G.dx=0;G.lock="";},{passive:true});
  document.addEventListener("pointermove",ev=>{if(!G.el&&!G.day)return;const dx=ev.clientX-G.x,dy=ev.clientY-G.y;
    if(!G.lock){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)G.lock="x";else if(Math.abs(dy)>12)G.lock="y";}
    if(G.lock!=="x")return;G.dx=dx;if(G.el){G.el.style.transform="translateX("+Math.max(-120,Math.min(120,dx))+"px)";G.el.classList.toggle("sw-r",dx>70);G.el.classList.toggle("sw-l",dx<-70);}},{passive:true});
  const end=()=>{const el=G.el,dx=G.dx,lock=G.lock,day=G.day;G.el=null;G.day=false;G.lock="";if(el){el.style.transform="";el.classList.remove("sw-r","sw-l");}
    if(lock!=="x")return;
    if(el){const t=allTasks().find(x=>x.key===el.dataset.task);if(!t)return;if(dx>90){if(!pendFor(t.key).some(p=>p.tool==="erledigen")){el.classList.add("pop");doneTask(t);}}else if(dx<-90){vib(10);moveTask(t,addDays(ymd(new Date()),1));}
      UMB.swiped=Date.now();return;}
    if(day&&Math.abs(dx)>80)shiftDay(dx<0?1:-1);};
  document.addEventListener("pointerup",end,{passive:true});document.addEventListener("pointercancel",()=>{if(G.el)G.el.style.transform="";G.el=null;G.day=false;G.lock="";},{passive:true});}

/* ---------- Klicks des Umbaus (vor den alten, damit "Tag öffnen" im Reiter Woche bleibt) ---------- */
document.addEventListener("click",ev=>{
  if(UMB.swiped&&Date.now()-UMB.swiped<400){ev.stopImmediatePropagation();ev.preventDefault();return;}
  const stop=()=>{ev.stopImmediatePropagation();ev.preventDefault();};
  const od=ev.target.closest("[data-openday]");if(od){stop();TAB.day=od.dataset.openday;setTab("woche");TAB.day=od.dataset.openday;render();window.scrollTo(0,0);return;}
  const sb=ev.target.closest(".subtabs [data-sub]");if(sb&&sb.dataset.sub==="unterwegs"){stop();setTab("unterwegs");return;}
  const ds=ev.target.closest("[data-dshift]");if(ds){stop();if(!ds.disabled)shiftDay(+ds.dataset.dshift);return;}
  const sh=ev.target.closest("[data-shift]");if(sh){stop();sheetShift(sh.dataset.shift);return;}
  const pl=ev.target.closest("[data-plus]");if(pl){stop();const k=pl.dataset.plus;if(k==="aufgabe")sheetNewTask();else if(k==="termin")sheetTermin();else if(k==="notiz")sheetNotiz();else sheetDiktat();return;}
  if(ev.target.closest("#fab")){stop();vib(8);sheetPlus();return;}
  const qo=ev.target.closest("[data-qopt]");if(qo){stop();const q=((APP.data&&APP.data.questions)||[]).find(x=>x.id===qo.dataset.qid);if(q){const a=q.options[+qo.dataset.qopt];auftrag("antwort",{id:q.id,frage:q.q,antwort:a,von:q.from||""},"Antwort: "+a,"q|"+q.id);}return;}
  const qw=ev.target.closest("[data-qown]");if(qw){stop();const q=((APP.data&&APP.data.questions)||[]).find(x=>x.id===qw.dataset.qown);const inp=document.getElementById("qa-"+qw.dataset.qown);const a=inp&&inp.value.trim();
    if(q&&a)auftrag("antwort",{id:q.id,frage:q.q,antwort:a,von:q.from||""},"Antwort: "+a.slice(0,50),"q|"+q.id);else toast("Antwort fehlt.",3000,true);return;}
  const cp=ev.target.closest("[data-chat]");if(cp){stop();const c=((APP.data&&APP.data.conflicts)||[]).find(x=>x.id===cp.dataset.chat);
    if(c)chatPrompt("Konflikt aus der Inka-App ("+(c.date?dlabel(c.date):"")+"): "+c.text+"\nOptionen: "+(c.options||[]).map((o,i)=>(i+1)+") "+o.label+(o.auftrag?" ["+o.auftrag+"]":"")).join("; ")+"\nBitte mit mir klären und dann umsetzen.");return;}
},true);

/* ---------- Reiter und Rendern ---------- */
function setTab(t,sub){if(t==="jetzt")t="heute";TAB.cur=t;store.set("tab",t);if(sub){MEHR.cur=sub;store.set("mehr",sub);}if(t!=="woche")TAB.day="";if(t==="unterwegs"&&!D.open){D.open=true;D.locate();}render();window.scrollTo(0,0);}
function render(){
  if(TAB.cur==="jetzt")TAB.cur="heute";
  document.body.classList.toggle("raster",TAB.cur==="show");
  document.querySelectorAll("main>section").forEach(x=>x.classList.toggle("on",x.id==="t-"+TAB.cur));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB.cur||(TAB.cur==="unterwegs"&&b.dataset.tab==="mehr")));
  const fab=$("#fab");if(fab)fab.hidden=!KEY.raw||TAB.cur==="show";
  if(!KEY.raw){TAB.cur="heute";document.querySelectorAll("main>section").forEach(x=>x.classList.toggle("on",x.id==="t-heute"));renderSetup();renderMini();return;}
  try{updBar();
    if(TAB.cur==="heute"){renderSetup();patchSetup();renderHeute();renderMini();}
    else if(TAB.cur==="woche"){renderWoche();renderMini();}
    else if(TAB.cur==="show")renderShow();
    else if(TAB.cur==="unterwegs"){renderDeps();renderMini();}
    else if(TAB.cur==="mehr"){renderMehr();renderMini();}}catch(e){console.error(e);diag("render-fehler",{tab:TAB.cur,e:String(e&&e.message||e).slice(0,120)});}
  document.body.classList.toggle("mini-on",!!($("#mini")&&$("#mini").classList.contains("on")));
  if(!S.doc||TAB.cur!=="show"){const d=new Date();$("#title").textContent=WD[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+".";
    $("#subt").textContent=({heute:"Dein Tag",woche:"Sieben Tage",unterwegs:"Abfahrten",mehr:({aufgaben:"Aufgaben",projekte:"Projekte",nachrichten:"Perlentaucher",ueberblick:"Überblick"})[MEHR.cur]||""})[TAB.cur]||"";}
  if(TAB.cur==="show")$("#subt").textContent="Raster FM";
}
window.__inkaNativeUmbau=function(o){if(o&&o.type==="perms"){PERM.mic=o.mic?"granted":"prompt";PERM.geo=o.geo?"granted":"prompt";render();return true;}return false;};
{const _n=window.__inkaNative;window.__inkaNative=function(o){if(window.__inkaNativeUmbau(o))return;return _n&&_n(o);};}
