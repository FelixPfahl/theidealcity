<style>
/* Layout: eine Hand, ein Blick. Oben die Uhr, Mitte die laufende Phase riesig, unten vier Daumentasten. Dunkel, ruhig, ein Blau. */
:root{
  --bg:#0b0c10; --surface:#15171d; --line:#262a33; --fg:#eceef3; --muted:#8b91a0;
  --accent:#0028ff; --accent-text:#8296ff; --warn:#e2b04a; --ok:#6fcf97;
  --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;max-width:640px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.date{color:var(--muted);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;font-stretch:80%}
.sim{color:var(--warn);font-size:13px;margin-left:6px}
.eyebrow{color:var(--muted);font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin:18px 0 6px}
.form{color:var(--accent-text);font-weight:800;font-stretch:75%;font-size:clamp(34px,10vw,52px);line-height:1;text-wrap:balance}
.ptitle{font-size:24px;font-weight:600;margin-top:6px;text-wrap:balance}
.count{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:14px;min-width:0}
.count b{font-size:clamp(72px,26vw,140px);font-weight:800;font-stretch:62%;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count span{color:var(--muted);font-size:18px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.regie{font-size:21px;line-height:1.45;margin-top:18px}
.next{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:17px}
.next strong{color:var(--fg);font-weight:600}
.ctrl{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{flex:1 1 30%;min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.nav button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.status{margin-top:10px;font-size:15px;color:var(--warn);min-height:1.2em}
.hint{margin-top:16px;font-size:15px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.item{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item time{font-variant-numeric:tabular-nums;font-weight:700;font-stretch:80%}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:15px}
.item.past{opacity:.45}
.item.now time,.item.now .t{color:var(--accent-text)}
.phases{grid-column:1/-1;margin:6px 0 0;padding:0;list-style:none}
.phases li{display:grid;grid-template-columns:92px 1fr;gap:12px;font-size:16px;padding:4px 0;color:var(--muted)}
.phases li.cur{color:var(--fg);font-weight:600}
.phases li span{font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:20px}
.list li{margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;font-size:16px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.card p{margin:4px 0;overflow-wrap:anywhere}
.work{font-weight:600}
.work em{font-style:italic}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px}
summary{font-weight:600;cursor:pointer;min-height:32px}
details p{color:var(--muted);margin:8px 0 2px}
label{display:block;font-size:15px;color:var(--muted);margin:16px 0 6px}
textarea{width:100%;box-sizing:border-box;min-height:120px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:18px}
textarea:focus{outline:2px solid var(--accent-text)}
.seg{display:flex;gap:8px}
.seg .chip{flex:1;text-align:center}
.saved{color:var(--ok);font-size:14px;min-height:1.2em;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:6px}
.nav button{min-height:60px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:16px;padding:0 2px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg)}
.small{font-size:14px;color:var(--muted)}
input[type=time]{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.pill{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.pill.warn{background:rgba(226,176,74,.15);color:var(--warn)}
.remote{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.remote .btn{min-height:64px}
@media (min-width:420px){.remote{grid-template-columns:repeat(4,1fr)}}
.verlauf{display:grid;gap:6px;margin-top:8px}.vrow{display:grid;grid-template-columns:52px 1fr 60px 1fr 44px;gap:6px;align-items:center;font-size:14px;color:var(--muted)}.vb{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.vb i{display:block;height:100%;background:var(--accent)}.vb.s i{background:var(--muted)}
.toolbox{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0 18px;background:var(--surface)}
.zufall{font-size:46px;font-weight:800;line-height:1.05;margin:6px 0 4px;color:var(--fg);word-break:break-word}
.gruppen li{margin:8px 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.kt{min-height:76px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kt b{font-size:17px;line-height:1.15}
.kt span{font-size:18px;letter-spacing:.12em;color:var(--accent-text)}
.kt.ha{background:var(--accent);border-color:var(--accent);color:#fff}.kt.ha span{color:#fff;font-weight:800;letter-spacing:.04em}
.ki{margin-top:30px;font-size:13px;color:var(--muted)}
.count.paused b{color:var(--muted)}
.fern{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fern .btn{min-height:min(12vh,96px);font-size:22px}
.fern .btn.wide{grid-column:1 / -1;min-height:min(20vh,150px);font-size:32px}
.fv .count{margin-top:2px}.fv .count b{font-size:min(15vw,64px)}
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:7;height:40px;display:flex;background:#07080b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.appbar a{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.appbar a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
body.has-appbar .nav{bottom:40px}
body.has-appbar .wrap{padding-bottom:170px}
.keys{display:none;font-size:13px;color:var(--muted);margin-top:8px}
@media (max-height:520px){
  .eyebrow{margin:8px 0 2px}
  .form{font-size:28px}
  .ptitle{font-size:18px;margin-top:2px}
  .count{margin-top:4px}
  .count b{font-size:min(26vw,22vh,140px)}
  .nav button{min-height:44px}
  .nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:760px){
  .wrap{max-width:720px}
  .nav{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
  .keys{display:block}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ===== Tagesdaten (später vom Morgenlauf befüllt) ===== */
/* Atelier-Schlüssel: Verschlüsselung der Tagesdaten und der Kopplung (AES-GCM, Schlüssel per PBKDF2 aus dem 16-stelligen Atelier-Schlüssel).
   Der Schlüssel liegt nur auf Josefs Geräten (localStorage) und wird nie über das Netz geschickt. */
const Geheim = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const cache = {};
  async function key(s, salt){
    const id = salt + ":" + norm(s); if (cache[id]) return cache[id];
    const base = await crypto.subtle.importKey("raw", te.encode(norm(s)), "PBKDF2", false, ["deriveKey"]);
    return cache[id] = await crypto.subtle.deriveKey({name:"PBKDF2", salt: te.encode(salt), iterations: 150000, hash: "SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
  }
  async function open(box, s, salt){
    const k = await key(s, salt || "atelier-daten-v1");
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(box.iv)}, k, unb64(box.ct));
    return JSON.parse(td.decode(pt));
  }
  async function seal(obj, s, salt){
    const k = await key(s, salt || "atelier-daten-v1");
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, te.encode(JSON.stringify(obj))));
    return {v:1, iv: b64(iv), ct: b64(ct)};
  }
  async function topic(s){
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode("atelier-topic-v1:" + norm(s))));
    return "atelier-" + Array.from(h.slice(0, 12), b => b.toString(16).padStart(2, "0")).join("");
  }
  const get = () => { try { return localStorage.getItem("atelier-schluessel") || ""; } catch(e){ return ""; } };
  const set = v => { try { if (v) localStorage.setItem("atelier-schluessel", norm(v)); else localStorage.removeItem("atelier-schluessel"); } catch(e){} };
  const valid = v => norm(v).length === 16;
  const pretty = v => norm(v).toUpperCase().replace(/(.{4})(?=.)/g, "$1-");
  /* Schlüssel aus dem Link-Anker (#s=...) übernehmen; der Anker geht nie an einen Server */
  function fromHash(){
    const m = location.hash.match(/[#&]s=([A-Za-z0-9-]+)/);
    if (m && valid(m[1])){ set(m[1]); try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} return true; }
    return false;
  }
  const isBox = o => !!(o && typeof o === "object" && o.iv && o.ct);
  return {norm, open, seal, topic, get, set, valid, pretty, fromHash, isBox};
})();

/* ===== Hilfsfunktionen ===== */
const $ = s => document.querySelector(s);
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt = m => { m = Math.round(m); const h = Math.floor(m/60), mm = m%60; return h + "." + String(mm).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const todayIso = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
let DAY = null, MORGEN = null, KEY = "", state = {adj:{}, notes:{}, sim:null, pause:{}}, lessons = [];
function setDay(d){
  DAY = d && d.items ? d : {date:"", label:"", items:[], drucken:[], bewertung:[], bewertungHinweis:""};
  DAY.drucken = DAY.drucken || []; DAY.bewertung = DAY.bewertung || []; DAY.bewertungHinweis = DAY.bewertungHinweis || "";
  KEY = "pult-" + DAY.date;
  state = store.get(KEY, {adj:{}, notes:{}, sim:null});
  state.adj = state.adj || {}; state.notes = state.notes || {}; state.pause = state.pause || {};
  lessons = DAY.items.filter(i => i.type === "lesson");
}
const fresh = () => DAY && DAY.date === todayIso();
/* nur <em> aus den Daten zulassen */
const rich = s => esc(s).replace(/&lt;(\/?)em&gt;/g, "<$1em>");
const save = () => store.set(KEY, state);

function nowSec(){
  const d = new Date();
  let s = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
  if (state.sim != null) s += state.sim;
  return s;
}


/* Phasen mit Verzug neu berechnen: die aktuelle Phase wird länger oder kürzer,
   der Ausgleich kommt aus der nächsten Phase mit Puffer, sonst aus der längsten späteren Phase. */
/* ===== Gemeinsame Zeitrechnung (identisch in Pult und Folien) =====
   base: Phasen [{d, puffer, form, titel, ...}], adj: Liste der Eingriffe, pause: {at, t0} oder null, nowMin: jetzt in Minuten.
   Eingriffe:
   {at, delta}                   Phase länger (+) oder kürzer (−)
   {at, delta, pause:true}       Pause in Phase at (zählt wie länger)
   {back:true, at, cut, src, d}  Phase at endet nach cut Min., danach noch einmal Phase src für d Min.
   {drop:true, at}               Phase at fällt weg
   {at, delta, shift:true}       (alt) Phase länger, Stunde verschiebt sich
   Ausgleich: fehlende Zeit kommt erst aus dem Puffer, dann aus dem Input (lehrerzentrierte Phasen, längste zuerst),
   erst dann aus der längsten späteren Arbeitsphase (nie unter 5 Min.; Aufräumen, Exit-Ticket und Abschluss nie). Gewonnene Zeit geht in die nächste Arbeitsphase. Reicht es nicht, bleibt ein Rest (debt):
   dann schlägt Pult vor, eine Phase zu streichen. */
const ARBEIT = /arbeit/i, SCHUTZ = /aufräum|aufraeum|abschluss|exit|ausblick/i, MINPH = 5;
const INPUT = /hinschauen|besprechen|plenum|input|vortrag|demonstr|gespräch|kamera/i;
function planCore(base, adj, pause, nowMin){
  let ph = base.map((p, i) => ({...p, src: i, uid: i, again: false, pl: p.puffer || 0, dropped: false}));
  let uids = base.length;
  let debt = 0;
  const notes = [], taken = [];   /* was ausgeglichen wurde, wird bei Zeitgewinn zuerst zurückgegeben */
  const list = (adj || []).slice();
  if (pause && nowMin != null) list.push({at: pause.at, delta: Math.max(0, nowMin - pause.t0), pause: true, live: true});
  const work = q => ARBEIT.test(q.form || "") && !q.dropped && !SCHUTZ.test((q.titel || "") + " " + (q.form || ""));
  const inp = q => INPUT.test(q.form || "") && !ARBEIT.test(q.form || "") && !q.dropped && !SCHUTZ.test((q.titel || "") + " " + (q.form || ""));
  const free = q => !q.dropped && !SCHUTZ.test((q.titel || "") + " " + (q.form || ""));
  /* D Minuten aus späteren Phasen nehmen; Rückgabe: was übrig bleibt, und wo genommen wurde */
  function take(from, D){
    let left = D, first = -1;
    for (let j = from + 1; j < ph.length && left > 1e-6; j++){
      const q = ph[j];
      if (q.pl > 0 && free(q)){ const t = Math.min(left, q.pl, Math.max(0, q.d - MINPH)); if (t > 0){ ph[j] = {...q, d: q.d - t, pl: q.pl - t}; taken.push({uid: ph[j].uid, t, pl: true}); left -= t; if (first < 0) first = j; } }
    }
    for (const pick of [inp, work]) while (left > 1e-6){
      let best = -1, bd = MINPH;
      for (let j = from + 1; j < ph.length; j++) if (pick(ph[j]) && ph[j].d > bd){ bd = ph[j].d; best = j; }
      if (best < 0) break;
      const t = Math.min(left, bd - MINPH);
      ph[best] = {...ph[best], d: bd - t}; taken.push({uid: ph[best].uid, t, pl: false}); left -= t; if (first < 0) first = best;
    }
    return {left, first};
  }
  /* G Minuten verteilen: erst Rest abbauen, dann Ausgeglichenes zurückgeben, dann nächste Arbeitsphase */
  function give(from, G){
    if (debt > 0){ const t = Math.min(debt, G); debt -= t; G -= t; }
    let back = -1;
    while (G > 1e-6 && taken.length){
      const e = taken[taken.length - 1];
      const j = ph.findIndex(x => x.uid === e.uid);
      if (j <= from){ taken.pop(); continue; }
      const t = Math.min(G, e.t);
      ph[j] = {...ph[j], d: ph[j].d + t, pl: ph[j].pl + (e.pl ? t : 0)};
      e.t -= t; G -= t; back = j;
      if (e.t <= 1e-6) taken.pop();
    }
    if (G <= 1e-6) return back;
    let j = -1;
    for (let i = from + 1; i < ph.length; i++) if (work(ph[i])){ j = i; break; }
    if (j < 0) for (let i = from + 1; i < ph.length; i++) if (ph[i].pl > 0 && free(ph[i])){ j = i; break; }
    if (j < 0) return -1;
    ph[j] = {...ph[j], d: ph[j].d + G};
    return j;
  }
  for (const a of list){
    if (a.back){
      if (a.at < ph.length && ph[a.src]){
        const old = ph[a.at].d, cut = Math.max(0, Math.min(a.cut, old + 60));
        ph[a.at] = {...ph[a.at], d: cut};
        ph.splice(a.at + 1, 0, {...ph[a.src], uid: uids++, d: a.d, pl: 0, puffer: 0, again: true, dropped: false});
        const extra = (cut - old) + a.d;
        let target = -1;
        if (extra > 0){ const r = take(a.at + 1, extra); debt += r.left; target = r.first; }
        else if (extra < 0) target = give(a.at + 1, -extra);
        notes.push({a, target});
      }
      continue;
    }
    if (a.drop){
      const q = ph[a.at];
      if (q && !q.dropped){ const freed = q.d; ph[a.at] = {...q, d: 0, dropped: true}; give(a.at, freed); }
      notes.push({a, target: -1});
      continue;
    }
    if (!ph[a.at]) continue;
    ph[a.at] = {...ph[a.at], d: Math.max(0, ph[a.at].d + a.delta)};
    let target = -1;
    if (!a.shift){
      if (a.delta > 0){ const r = take(a.at, a.delta); debt += r.left; target = r.first; }
      else if (a.delta < 0) target = give(a.at, -a.delta);
    }
    notes.push({a, target});
  }
  return {ph, notes, debt};
}
/* Startzeiten dazurechnen */
function withStarts(ph, start){ let t = start; return ph.map(p => { const o = {...p, s: t}; t += p.d; return o; }); }
/* Phase nach Uhrzeit (gestrichene Phasen überspringen) */
function phaseAt(phases, nowMin){ for (let i = 0; i < phases.length; i++) if (!phases[i].dropped && nowMin < phases[i].s + phases[i].d) return i; return phases.length - 1; }
/* Letzte Arbeitsphase vor idx und ihre Restzeit (was beim Weitergehen übrig war, sonst 5 Min.) */
function backInfo(phases, adj, idx){
  let k = -1;
  for (let i = idx - 1; i >= 0; i--) if (ARBEIT.test(phases[i].form) && !phases[i].dropped){ k = i; break; }
  if (k < 0) return null;
  let cut = 0;
  for (const a of (adj || [])) if (!a.back && !a.drop && !a.shift && !a.pause && a.at === k && a.delta < 0) cut += -a.delta;
  let r = Math.round(cut); if (r < 1) r = 5;
  return {k, r, titel: phases[k].titel};
}
/* Vorschlag zum Streichen, wenn die Stunde sonst zu lang wird: die späteste spätere Phase, die keine Arbeit und kein Abschluss ist */
function dropHint(phases, idx){
  for (let i = phases.length - 1; i > idx; i--){ const q = phases[i]; if (!q.dropped && !ARBEIT.test(q.form || "") && !SCHUTZ.test((q.titel || "") + " " + (q.form || "")) && q.d > 0) return i; }
  for (let i = phases.length - 1; i > idx; i--){ const q = phases[i]; if (!q.dropped && !SCHUTZ.test((q.titel || "") + " " + (q.form || "")) && q.d > 0) return i; }
  return -1;
}
/* Kennung der Phasenfolge: nur wenn beide Seiten gleich rechnen, werden Eingriffe übernommen */
function phaseSig(list){ return list.map(p => p.d + "/" + (p.puffer || 0)).join(","); }

function plan(lesson){
  const base = lesson.phases.map(p => ({t:p[0], d:p[1], form:p[2], titel:p[3], regie:p[4], puffer:p[5]||0}));
  const {ph, notes, debt} = planCore(base, state.adj[lesson.id], state.pause[lesson.id] || null, nowSec()/60);
  const out = withStarts(ph, toMin(base[0].t));
  const last = out[out.length - 1];
  return {phases:out, end:last.s + last.d, planEnd:toMin(lesson.end), notes, debt};
}

function locate(sec){
  const min = sec/60;
  for (const l of lessons){
    const p = plan(l);
    const s = toMin(l.start);
    if (min >= s && min < Math.max(p.end, toMin(l.end))){
      let idx = p.phases.length-1;
      for (let i = 0; i < p.phases.length; i++){ if (min < p.phases[i].s + p.phases[i].d){ idx = i; break; } }
      return {lesson:l, plan:p, idx};
    }
  }
  return null;
}
function nextLesson(sec){ return lessons.find(l => toMin(l.start)*60 > sec) || null; }

const KL = { klassen: store.get("pult-klassen", {}), log: store.get("pult-klog", {stoer:{}, spaet:[], ha:[], nach:[]}) };
KL.log.stoer = KL.log.stoer || {}; KL.log.stoerU = KL.log.stoerU || {}; KL.log.stunden = KL.log.stunden || {};

KL.da = store.get("pult-da", {}); KL.topf = store.get("pult-topf", {}); KL.aemter = store.get("pult-aemter", {});
const AMT_STD = ["Material austeilen", "Material einsammeln", "Tische", "Waschbecken und Pinsel", "Boden"];
const ROLLEN = ["Sprecher", "Zeitwächter", "Materialchef", "Schreiber"];

/* Ämter der Woche: rotiert jede Woche um so viele Plätze, wie es Ämter gibt (gleiche Rechnung am Notebook) */
function aemterPlan(names, cfg, iso){
  const liste = cfg && cfg.liste && cfg.liste.length ? cfg.liste : AMT_STD, je = Math.max(1, (cfg && cfg.je) || 2), n = names.length;
  if (!n) return [];
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  const w = Math.round(d.getTime() / 6048e5), total = Math.min(n, liste.length * je), off = (w * total) % n;
  return liste.map((a, i) => ({amt: a, wer: Array.from({length: je}, (_, j) => i * je + j).filter(x => x < total).map(x => names[(off + x) % n])}));
}
function anwesend(l){ const ab = KL.da[lkey(l)] || []; return klNames(klasseOf(l)).map(n => n.raw).filter(r => !ab.includes(r)); }
/* Zufallsaufruf: niemand doppelt, bevor alle dran waren */
function ziehen(l){
  const kl = klasseOf(l), all = anwesend(l);
  let t = (KL.topf[kl] || []).filter(r => all.includes(r));
  if (!t.length) t = all.slice();
  if (!t.length) return null;
  const r = t.splice(Math.floor(Math.random() * t.length), 1)[0];
  KL.topf[kl] = t; store.set("pult-topf", KL.topf);
  return r;
}
function mischen(raws, size){
  const a = raws.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const g = Math.max(1, Math.round(a.length / size)), out = Array.from({length: g}, () => []);
  a.forEach((r, i) => out[i % g].push(r));
  return out;
}

function zeigeAmPC(art, kl, daten){

  const msg = {v: 1, cmd: "zeige", at: Date.now(), art, klasse: kl, daten};
  pairTopic().then(async t => fetch(NTFY + "/" + t + "-fern", {method: "POST", body: await pack(msg)})).catch(() => {});
  return true;
}

/* Stunde der Klasse merken (für das Klassenziel „3 Stunden ohne Verspätung“) */
function klStunde(l){ const kl = klasseOf(l), k = lkey(l), a = KL.log.stunden[kl] = KL.log.stunden[kl] || []; if (!a.includes(k)){ a.push(k); a.sort(); klSave(); } }

/* Halbjahr: 1 = September bis Januar (Ablaufplan: Ende etwa 01.02.), 2 = Februar bis August */
function halbjahr(iso){ const [y, m] = iso.split("-").map(Number); if (m >= 9) return y + "-1"; if (m < 2) return (y - 1) + "-1"; return (y - 1) + "-2"; }
/* "Nachname, Vorname" -> Vorname; bei gleichen Vornamen mit Initiale */
function klNames(klasse){
  const raw = (KL.klassen[klasse] || []).filter(Boolean);
  const first = r => { const p = r.split(","); return (p.length > 1 ? p[1] : p[0]).trim().split(/\s+/)[0] || r.trim(); };
  const last = r => { const p = r.split(","); return p.length > 1 ? p[0].trim() : (r.trim().split(/\s+/).slice(1).join(" ") || ""); };
  const cnt = {}; raw.forEach(r => { const f = first(r); cnt[f] = (cnt[f] || 0) + 1; });
  return raw.map(r => ({raw: r.trim(), show: cnt[first(r)] > 1 && last(r) ? first(r) + " " + last(r)[0] + "." : first(r)}));
}
const lkey = l => DAY.date + ":" + toMin(l.start);
function klasseOf(l){ return String(l.klasse || "").trim(); }
/* Störung zählen; beim dritten Mal Hausaufgabe */
function stoer(l, name, d){
  const k = lkey(l), m = KL.log.stoer[k] = KL.log.stoer[k] || {};
  const before = m[name] || 0;
  KL.log.stoerU[k] = Date.now();
  m[name] = Math.max(0, before + d);
  if (!m[name]) delete m[name];
  const has = KL.log.ha.find(h => h.lesson === k && h.name === name && !h.del);
  if (before < 3 && (m[name] || 0) >= 3 && !has){
    KL.log.ha.push({id: uid(), klasse: klasseOf(l), name, date: DAY.date, lesson: k, done: false, u: Date.now()});
    try { if (window.AtelierApp && AtelierApp.vibrate) AtelierApp.vibrate(700); else if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch(e){}
  } else if ((m[name] || 0) < 3 && has && !has.done){ has.del = true; has.u = Date.now(); }
  else { try { if (window.AtelierApp && AtelierApp.vibrate) AtelierApp.vibrate(40); else if (navigator.vibrate) navigator.vibrate(40); } catch(e){} }
  klSave();
}
function spaetSum(klasse, name, iso){
  const h = halbjahr(iso || DAY.date);
  const s = KL.log.spaet.filter(e => e.klasse === klasse && e.name === name && !e.del && !e.ent && halbjahr(e.date) === h).reduce((a, e) => a + e.min, 0);
  const n = KL.log.nach.filter(e => e.klasse === klasse && e.name === name && !e.del && halbjahr(e.date) === h).reduce((a, e) => a + e.min, 0);
  return {sum: s, open: s - n};
}

/* Verlauf je Woche: Verspätungsminuten und Störungen (nur für dich) */
function wk(iso){ const d = new Date(iso + "T12:00:00"); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); }
function verlaufHtml(kl){
  const weeks = {};
  for (const e of KL.log.spaet) if (e.klasse === kl && !e.del && !e.ent){ const w = wk(e.date); (weeks[w] = weeks[w] || {m: 0, s: 0}).m += e.min; }
  for (const [k, v] of Object.entries(KL.log.stoer)){ const l = lessons.find(x => lkey(x) === k); const kk = l ? klasseOf(l) : null; if (kk !== kl && !(KL.log.stunden[kl] || []).includes(k)) continue; const w = wk(k.slice(0, 10)); (weeks[w] = weeks[w] || {m: 0, s: 0}).s += Object.values(v).reduce((a, b) => a + b, 0); }
  const keys = Object.keys(weeks).sort().slice(-6);
  if (!keys.length) return `<p class="small">Noch keine Daten.</p>`;
  const max = Math.max(1, ...keys.map(w => Math.max(weeks[w].m, weeks[w].s)));
  return `<div class="verlauf">${keys.map(w => `<div class="vrow"><span>${w.slice(8,10)}.${w.slice(5,7)}.</span><span class="vb"><i style="width:${(weeks[w].m / max * 100).toFixed(0)}%"></i></span><span>${Math.round(weeks[w].m)} Min.</span><span class="vb s"><i style="width:${(weeks[w].s / max * 100).toFixed(0)}%"></i></span><span>${weeks[w].s} St.</span></div>`).join("")}</div><p class="small">Oben je Woche: Verspätungsminuten (blau) und Störungen (grau).</p>`;
}

/* Abgleich mit dem Notebook: nur mit Atelier-Schlüssel (sonst bleiben Namen auf dem Gerät) */
function klMerge(o){
  if (!o) return false;
  let ch = false;
  if (o.klassen) for (const [k, v] of Object.entries(o.klassen)) if (k !== "_u" && Array.isArray(v) && v.length && !(KL.klassen[k] || []).length){ KL.klassen[k] = v; ch = true; }
  for (const key of ["spaet", "ha", "nach"]) for (const e of (o[key] || [])){
    const i = KL.log[key].findIndex(x => x.id === e.id);
    if (i < 0){ KL.log[key].push(e); ch = true; } else if ((e.u || 0) > (KL.log[key][i].u || 0)){ KL.log[key][i] = e; ch = true; }
  }
  if (o.verborgen && (o.verborgen._u || 0) > (KL.verborgen._u || 0)){ KL.verborgen = o.verborgen; ch = true; }
  if (o.aemter) for (const [k, v] of Object.entries(o.aemter)) if (v && (v._u || 0) > ((KL.aemter[k] || {})._u || 0)){ KL.aemter[k] = v; store.set("pult-aemter", KL.aemter); ch = true; }
  if (o.stunden) for (const [k, v] of Object.entries(o.stunden)){ const a = KL.log.stunden[k] = KL.log.stunden[k] || []; for (const x of v) if (!a.includes(x)){ a.push(x); ch = true; } a.sort(); }
  if (o.stoer) for (const [k, v] of Object.entries(o.stoer)){ const u = (o.stoerU || {})[k] || 0; if (u > (KL.log.stoerU[k] || 0)){ KL.log.stoer[k] = v; KL.log.stoerU[k] = u; ch = true; } }
  if (ch) klSave(false);
  return ch;
}
let klTimer = null;
function klSync(){
  if (!pair.code || typeof Geheim === "undefined" || !Geheim.get()) return;
  clearTimeout(klTimer);
  klTimer = setTimeout(() => {
    const today = {}, tu = {}; for (const [k, v] of Object.entries(KL.log.stoer)) if (k.startsWith(DAY.date)){ today[k] = v; tu[k] = KL.log.stoerU[k] || 0; }
    const h = halbjahr(DAY.date), cut = x => halbjahr(x.date) === h;
    const msg = {v: 1, cmd: "klog", kind: "klog", at: Date.now(), klassen: KL.klassen, aemter: KL.aemter, verborgen: KL.verborgen, stunden: KL.log.stunden, stoer: today, stoerU: tu, spaet: KL.log.spaet.filter(cut), ha: KL.log.ha.filter(cut), nach: KL.log.nach.filter(cut)};
    pairTopic().then(async t => fetch(NTFY + "/" + t + "-fern", {method: "POST", body: await pack(msg)})).catch(() => {});
  }, 400);
}

  v.innerHTML = map[view]() + (view === "jetzt" ? remoteHtml() : "");
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === view ? "page" : "false"));
  document.querySelectorAll(".appbar a").forEach(a => a.setAttribute("aria-current", a.dataset.app === (view === "fern" ? "fern" : "pult") ? "page" : "false"));
  try { if (window.AtelierApp && AtelierApp.pultView) AtelierApp.pultView(view); } catch(e){}
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}

/* ===== Uhr ===== */
function tick(){
  const sec = nowSec();
  const h = Math.floor(sec/3600)%24, m = Math.floor(sec/60)%60;
  $("#clock").textContent = h + "." + String(m).padStart(2,"0");
  $("#simTag").hidden = state.sim == null;
  const loc = locate(sec);
  const key = loc ? loc.lesson.id + ":" + loc.idx : "none";
  if (lastKey !== null && key !== lastKey && loc){
    try { if (window.AtelierApp && AtelierApp.vibrate) AtelierApp.vibrate(450); else if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch(e){}
  }
  if (loc && fresh()) { const kk = lkey(loc.lesson), kl = klasseOf(loc.lesson); if (!((KL.log.stunden[kl] || []).includes(kk))) klStunde(loc.lesson); }
  const changed = key !== lastKey;
  lastKey = key;
  if (view === "jetzt" || view === "fern"){
    if (changed || !loc) render();
    else {
      const ph = loc.plan.phases[loc.idx];
      const left = Math.max(0, (ph.s+ph.d)*60 - sec);
      const cd = $("#cd"), pg = $("#pg");
      if (cd) cd.textContent = leftText(left);
      if (pg) pg.style.width = (Math.min(1, 1 - left/(ph.d*60))*100).toFixed(1) + "%";
    }
  } else if (changed && view === "tag") render();
}

/* ===== Bedienung ===== */
/* Zeit-Eingriffe: am Handy sofort, und bei Kopplung auch am Notebook (das Notebook führt, Pult übernimmt dessen Stand) */
function resumeIfPaused(id){
  const pz = state.pause[id]; if (!pz) return;
  (state.adj[id] = state.adj[id] || []).push({at: pz.at, delta: Math.max(0, nowSec()/60 - pz.t0), pause: true});
  delete state.pause[id];
}
function timeAct(act, id, i, k){
  const l = lessons.find(x => x.id === id); if (!l) return;
  const now = nowSec()/60;
  const list = state.adj[id] = state.adj[id] || [];
  if (act === "undo"){
    if (state.pause[id]) delete state.pause[id]; else list.pop();
  } else if (act === "pause"){
    if (state.pause[id]) resumeIfPaused(id); else state.pause[id] = {at: i, t0: now};
  } else {
    resumeIfPaused(id);
    const p = plan(l), ph = p.phases[i];
    if (act === "plus") list.push({at: i, delta: 5});
    else if (act === "weiter") list.push({at: i, delta: Math.max(0, now - ph.s) - ph.d});
    else if (act === "drop"){ if (p.phases[k]) list.push({drop: true, at: k}); }
    else if (act === "back"){
      const bk = backInfo(p.phases, list, i); if (!bk) return;
      list.push({back: true, at: i, cut: Math.max(0, now - ph.s), src: bk.k, d: bk.r});
    }
  }
  save(); lastKey = null; render();
  if (pair.code) sendFern(act === "weiter" ? "phase" : act, {lesson: l.start, k});
}

/* Tastatur am PC */
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("textarea,input")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const views = {"1":"jetzt","2":"klasse","3":"tag","4":"spick","5":"notiz"};
  let btn = null;
  if (views[e.key]) btn = document.querySelector(`.nav button[data-v="${views[e.key]}"]`);
  else if (view === "jetzt" && (e.key === " " || e.key === "ArrowRight")) btn = document.querySelector('[data-act="weiter"]');
  else if (view === "jetzt" && e.key === "+") btn = document.querySelector('[data-act="plus"]');
  else if (view === "jetzt" && (e.key === "z" || e.key === "Z")) btn = document.querySelector('[data-act="undo"]');
  if (btn){ e.preventDefault(); btn.click(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (klClick(b)) return;
  if (b.dataset.fern){ sendFern(b.dataset.fern); return; }
  if (b.dataset.v){ view = b.dataset.v; if (view !== "tag" && selected === "__morgen") selected = null; render(); window.scrollTo(0,0); keepAwake(); return; }
  if (b.dataset.sel){ selected = b.dataset.sel; render(); return; }
  if (b.dataset.day){ selected = b.dataset.day === "morgen" ? "__morgen" : null; render(); return; }
  const act = b.dataset.act;
  if (["plus","weiter","undo","pause","back","drop"].includes(act)){ timeAct(act, b.dataset.id, Number(b.dataset.i), Number(b.dataset.k)); return; }
  if (act === "plus" || act === "weiter"){
    const id = b.dataset.id, i = Number(b.dataset.i);
    let delta = 5;
    if (act === "weiter"){
      const l = lessons.find(x => x.id === id), p = plan(l), ph = p.phases[i];
      const ran = Math.max(0, nowSec()/60 - ph.s);
      delta = ran - ph.d;
    }
    (state.adj[id] = state.adj[id] || []).push({at:i, delta});
    save(); lastKey = null; render(); return;
  }
  if (act === "undo"){ const a = state.adj[b.dataset.id]; if (a) a.pop(); save(); lastKey = null; render(); return; }
  if (act === "pair"){
    const v = ($("#pairCode").value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (v.length < 6){ const s2 = $("#pairState"); if (s2) s2.textContent = "Der Code hat 8 Zeichen."; return; }
    pair = {code: v}; store.set("pult-kopplung", pair); connectPair(); render(); return;
  }
  if (act === "key"){ const s0 = $("#keyState"); setKey(($("#keyIn") || {}).value || "").then(t => { render(); const s2 = $("#keyState"); if (s2) s2.textContent = t; }); if (s0) s0.textContent = "Prüfe …"; return; }
  if (act === "unkey"){ Geheim.set(""); connectPair(); render(); return; }
  if (act === "unpair"){ pair = {}; store.set("pult-kopplung", pair); connectPair(); render(); return; }
  if (act === "simreset"){ state.sim = null; save(); lastKey = null; render(); tick(); return; }
  if (b.dataset.check){
    const n = state.notes[selected] = state.notes[selected] || {text:"", zeit:"", ziel:"", aendern:""};
    n[b.dataset.check] = n[b.dataset.check] === b.dataset.val ? "" : b.dataset.val;
    const ok = save(); render(); const s = $("#saved"); if (s) s.textContent = ok ? "Gespeichert." : "Speichern nicht möglich (Browser blockiert).";
  }
});
let saveTimer;
document.addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.field;
  if (f){
    const n = state.notes[selected] = state.notes[selected] || {text:"", zeit:"", ziel:"", aendern:""};
    n[f] = e.target.value;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { const ok = save(); const s = $("#saved"); if (s) s.textContent = ok ? "Gespeichert." : "Speichern nicht möglich (Browser blockiert)."; }, 400);
  }
  if (e.target.id === "simTime" && e.target.value){
    const d = new Date(), real = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
    state.sim = toMin(e.target.value)*60 - real;
    save(); lastKey = null; tick();
  }
});

function showDay(){
  $("#date").textContent = DAY.label || "Pult";
  const st = $("#stand"); if (st) st.textContent = DAY.date ? "Stand der Daten: " + DAY.label : "";
  lastKey = null; render(); tick();
}
async function getJson(path){
  const r = await fetch(path, {cache:"no-cache"});
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
/* Verschlüsselte Tagesdaten öffnen; ohne passenden Schlüssel bleibt der letzte Stand auf dem Handy */
let keyProblem = null;
async function unbox(x){
  if (!Geheim.isBox(x)) return x;
  const k = Geheim.get();
  if (!k){ keyProblem = "fehlt"; throw new Error("kein Schlüssel"); }
  try { const o = await Geheim.open(x, k); keyProblem = null; return o; }
  catch(e){ keyProblem = "falsch"; throw e; }
}
async function init(){
  let emb = {};
  try { emb = (await unbox(EMBED)) || {}; } catch(e){ emb = {}; }
  let cached = store.get("pult-last", null);
  let best = emb.heute || null;
  if (cached && cached.heute && (!best || cached.heute.date > best.date)) best = cached.heute;
  setDay(best); MORGEN = (cached && cached.morgen) || emb.morgen || null;
  showDay(); keepAwake();
  setInterval(tick, 1000);
  try {
    const h = await unbox(await getJson("daten/heute.json"));
    let m = null; try { m = await unbox(await getJson("daten/morgen.json")); } catch(e){}
    if (h && h.items && (!DAY.date || h.date >= DAY.date)){
      setDay(h); MORGEN = m;
      store.set("pult-last", {heute:h, morgen:m});
      showDay();
    }
  } catch(e){ /* offline, in Claude oder ohne Schlüssel: eingebettete bzw. letzte Daten bleiben */ }
  if (keyProblem) render();
}
async function setKey(raw){
  if (!Geheim.valid(raw)) return "Der Schlüssel hat 16 Zeichen.";
  const prev = Geheim.get();
  Geheim.set(raw); keyProblem = null;
  await init();
  if (keyProblem === "falsch"){ Geheim.set(prev); keyProblem = prev ? null : "fehlt"; if (prev) await init(); return "Dieser Schlüssel passt nicht. Bitte noch einmal prüfen."; }
  connectPair();
  return "Schlüssel gespeichert.";
}
function keyHtml(full){
  const has = !!Geheim.get();
  const msg = keyProblem === "falsch" ? "Der gespeicherte Schlüssel passt nicht zu den Daten." : keyProblem === "fehlt" ? "Die Tagesdaten sind verschlüsselt. Einmal den Atelier-Schlüssel eingeben." : has ? "Schlüssel ist auf diesem Gerät gespeichert." : "Noch kein Schlüssel auf diesem Gerät.";
  return `${full ? "<h2>Atelier-Schlüssel</h2>" : ""}<div class="regie">${esc(msg)}</div>
    <div class="ctrl"><input id="keyIn" aria-label="Atelier-Schlüssel" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" style="flex:1 1 60%;min-height:58px;font:inherit;font-size:20px;letter-spacing:.06em;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:0 14px"><button class="btn primary" data-act="key">Speichern</button>${has && full ? '<button class="btn" data-act="unkey">Entfernen</button>' : ""}</div>
    <div class="small" id="keyState">Der Schlüssel bleibt auf diesem Gerät und geht nie übers Netz.</div>`;
}
/* ===== Kopplung mit dem Schul-PC: Folie führt, Pult folgt (über ntfy.sh, nur Phase und Uhrzeit) ===== */
const NTFY = (new URLSearchParams(location.search).get("ntfy")) || "https://ntfy.sh";
let pair = store.get("pult-kopplung", {}), pairES = null, pairLive = false, pairLast = null;
function pairStatus(){
  if (!pair.code) return "Nicht gekoppelt.";
  if (!pairLive) return "Gekoppelt, warte auf Verbindung …";
  return pairLast ? "Gekoppelt. Letzte Folie: " + pairLast : "Gekoppelt und bereit.";
}
function showPairState(){ const s2 = $("#pairState"); if (s2) s2.textContent = pairStatus(); }
const led = {};
function applySync(m){
  if (m && m.kind === "klog"){ if (klMerge(m)) render(); return; }
  if (!m || m.v !== 1 || m.date !== DAY.date) return;
  const l = lessons.find(x => toMin(x.start) === toMin(m.lesson));
  if (!l) return;
  const mySig = phaseSig(l.phases.map(p => ({d: p[1], puffer: p[5] || 0})));
  if (Array.isArray(m.adj) && m.sig === mySig){
    const mine = state.adj[l.id] || [];
    if (!led[l.id] && !m.adj.length && !m.pause && (mine.length || state.pause[l.id])){
      /* Notebook frisch geöffnet, Handy hat schon Eingriffe: Stand ans Notebook geben */
      led[l.id] = true;
      sendFern("adj", {lesson: l.start, adj: mine, pause: state.pause[l.id] || null});
    } else {
      led[l.id] = true;
      state.adj[l.id] = m.adj.slice();
      if (m.pause) state.pause[l.id] = m.pause; else delete state.pause[l.id];
      save();
    }
    pairLast = l.klasse + ", Folie " + m.page;
    lastKey = null; render(); tick();
    return;
  }
  const i = l.phases.findIndex(ph => toMin(ph[0]) === toMin(m.phase));
  if (i < 0) return;
  const p = plan(l);
  const delta = Math.round(m.st - p.phases[i].s);
  if (i > 0 && delta !== 0 && Math.abs(delta) < 90){
    (state.adj[l.id] = state.adj[l.id] || []).push({at: i - 1, delta});
    save();
  }
  pairLast = l.klasse + ", Folie " + m.page;
  lastKey = null; render(); tick();
}
/* Fernbedienung: Befehle an den Schul-PC (eigener Kanal, keine Inhalte) */
let fernMsg = "";
function remoteHtml(){
  if (!pair.code) return "";
  return `<h2>Schul-PC</h2><div class="remote">
    <button class="btn" data-fern="prev" aria-label="Folie zurück">‹ Folie</button>
    <button class="btn primary" data-fern="next" aria-label="Folie weiter">Folie ›</button>
    <button class="btn" data-fern="black">Schwarz</button>
    <button class="btn" data-fern="timer">Timer</button>
    <button class="btn" data-fern="cam">Kamera</button></div>
    <div class="small" id="fernState">${esc(fernMsg)}</div>`;
}
function renderFern(){
  const sec = nowSec(), loc = fresh() ? locate(sec) : null;
  let head = `<div class="eyebrow">Fernbedienung</div>`;
  if (loc){
    const {lesson, plan:p, idx} = loc, ph = p.phases[idx];
    const left = Math.max(0, (ph.s + ph.d)*60 - sec);
    head = `<div class="fv"><div class="eyebrow">Fernbedienung · ${esc(lesson.klasse)} · ${esc(lesson.titel)}</div>
      <div class="ptitle">${esc(ph.form)}: ${esc(ph.titel)}</div>
      <div class="count"><b id="cd">${leftText(left)}</b><span>bis ${fmt(ph.s+ph.d)}</span></div>
      <div class="bar"><i id="pg" style="width:${(Math.min(1, 1 - left/(ph.d*60))*100).toFixed(1)}%"></i></div></div>`;
  }
  if (!pair.code) return head + `<div class="form">Noch nicht gekoppelt</div>
    <div class="regie">Am Notebook auf „QR-Code zum Koppeln zeigen“ klicken und mit der Handy-Kamera scannen. Oder unter „Tag“ den Code eingeben.</div>
    <div class="ctrl"><button class="btn primary" data-v="tag">Zum Koppeln</button></div>`;
  return head + `<div class="fern">
    <button class="btn primary wide" data-fern="next" aria-label="Folie weiter">Folie ›</button>
    <button class="btn" data-fern="prev" aria-label="Folie zurück">‹ Folie</button>
    <button class="btn" data-fern="black">Schwarz</button>
    <button class="btn" data-fern="timer">Timer groß</button>
    <button class="btn" data-fern="cam">Kamera</button>
    ${loc ? `<button class="btn${state.pause[loc.lesson.id] ? " primary" : ""}" data-act="pause" data-id="${loc.lesson.id}" data-i="${loc.idx}">${state.pause[loc.lesson.id] ? "Fortsetzen" : "Pause"}</button>` : `<button class="btn" disabled>Pause</button>`}
    ${loc && backInfo(loc.plan.phases, state.adj[loc.lesson.id], loc.idx) ? `<button class="btn" data-act="back" data-id="${loc.lesson.id}" data-i="${loc.idx}" style="grid-column:1 / -1">↩ Zurück zur Arbeitsphase</button>` : ""}</div>
    <div class="small" id="fernState">${esc(fernMsg)}</div>
    <div class="small">${esc(pairStatus())}</div>`;
}
function setFern(t){ fernMsg = t; const s2 = $("#fernState"); if (s2) s2.textContent = t; }
function sendFern(cmd, extra){
  try { if (window.AtelierApp && AtelierApp.vibrate) AtelierApp.vibrate(30); else if (navigator.vibrate) navigator.vibrate(30); } catch(e){}
  pairTopic().then(async t => fetch(NTFY + "/" + t + "-fern", {method:"POST", body: await pack(Object.assign({v:1, cmd, at: Date.now()}, extra || {}))}))
    .then(r => { if (!r.ok) throw 0; setFern("Gesendet: " + ({prev:"Folie zurück", next:"Folie weiter", black:"Schwarzbild", timer:"Timer", cam:"Kamera", pause:"Pause", back:"zurück zur Arbeitsphase", plus:"+5 Min.", phase:"nächste Phase", undo:"rückgängig", adj:"Stand"}[cmd] || cmd)); })
    .catch(() => setFern("Nicht gesendet: kein Netz. Am PC mit Tasten weiter."));
}
/* Kanal und Inhalt: mit Atelier-Schlüssel ein geheimer Kanal und verschlüsselte Nachrichten, sonst wie bisher */
async function pairTopic(){ const k = Geheim.get(); return k ? (await Geheim.topic(k)) + "-" + pair.code : "atelier-pult-" + pair.code; }
async function pack(obj){ const k = Geheim.get(); return JSON.stringify(k ? await Geheim.seal(obj, k, "atelier-kopplung-v1") : obj); }
async function unpack(s){
  const o = JSON.parse(s), k = Geheim.get();
  if (Geheim.isBox(o)){ if (!k) return null; try { return await Geheim.open(o, k, "atelier-kopplung-v1"); } catch(e){ return null; } }
  return k ? null : o;
}
function connectPair(){
  if (pairES){ try { pairES.close(); } catch(e){} pairES = null; }
  pairLive = false; showPairState();
  if (!pair.code || typeof EventSource === "undefined") return;
  try {
    const code = pair.code;
    pairTopic().then(t => {
      if (pair.code !== code || pairES) return;
      pairES = new EventSource(NTFY + "/" + t + "/sse");
      pairES.onopen = () => { pairLive = true; showPairState(); };
      pairES.onerror = () => { pairLive = false; showPairState(); };
      pairES.onmessage = async ev => {
        try { const d = JSON.parse(ev.data); if (d.event !== "message") return; const m = await unpack(d.message); if (m) applySync(m); } catch(e){}
      };
    });
  } catch(e){}
}

/* Koppeln per QR-Code: Link mit ?koppeln=<code> */
(function(){
  const k = new URLSearchParams(location.search).get("koppeln");
  if (!k) return;
  const v = k.toLowerCase().replace(/[^a-z0-9]/g, "");
  if (v.length >= 6){ pair = {code: v}; store.set("pult-kopplung", pair); fernMsg = "Gekoppelt per QR-Code."; }
  try { const u = new URL(location.href); u.searchParams.delete("koppeln"); history.replaceState(null, "", u.toString()); } catch(e){}
})();
/* Ansicht von außen setzen: Handy-App-Leiste, Adresse ?ansicht=fern oder #fern */
const VIEWS = ["jetzt","klasse","tag","spick","notiz","fern"];
window.AtelierSetView = function(v){ if (VIEWS.indexOf(v) < 0) return; view = v; render(); window.scrollTo(0,0); try { keepAwake(); } catch(e){} };
(function(){
  const q = new URLSearchParams(location.search).get("ansicht"), h = (location.hash || "").slice(1);
  if (VIEWS.indexOf(q) >= 0) view = q; else if (VIEWS.indexOf(h) >= 0) view = h;
  window.addEventListener("hashchange", () => { const x = (location.hash || "").slice(1); if (VIEWS.indexOf(x) >= 0) window.AtelierSetView(x); });
})();
/* Leiste zwischen den Apps, nur im Browser (in der Handy-App gibt es die Leiste unten von der App selbst) */
(function(){
  let inApp = false; try { inApp = !!(window.AtelierApp && AtelierApp.isApp()); } catch(e){}
  if (inApp || /claude\.ai|claudeusercontent/.test(location.hostname)) return;
  const bar = document.createElement("nav");
  bar.className = "appbar"; bar.setAttribute("aria-label", "Apps");
  bar.innerHTML = '<a data-app="atelier" href="https://raw.githack.com/FelixPfahl/theidealcity/atelier/index.html">Atelier</a><a data-app="pult" href="#jetzt">Pult</a><a data-app="fern" href="#fern">Fernbedienung</a>';
  bar.addEventListener("click", e => { const a = e.target.closest("a[data-app]"); if (!a || a.dataset.app === "atelier") return; e.preventDefault(); window.AtelierSetView(a.dataset.app === "fern" ? "fern" : (view === "fern" ? "jetzt" : view)); });
  document.body.appendChild(bar); document.body.classList.add("has-appbar");
})();
init();
connectPair();
</script>
