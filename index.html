<style>
:root{--blue:#0028FF;--ink:#111;--mut:#5a5a5a;--line:#d8d8d8;--bg:#fff;--soft:#f3f5ff;--red:#c4001a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Futura","Century Gothic","Avenir Next",system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:15px;margin-bottom:14px}
button{font:inherit;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
button:disabled{opacity:.45}
a{color:var(--blue)}
.card{border:2px solid var(--ink);border-radius:16px;padding:16px;margin:0 0 14px}

.bar i{display:block;height:100%;background:var(--blue);width:0}
.row{display:flex;gap:10px}.row>*{flex:1}
.chs{margin-top:10px;font-size:16px}
.ch{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.ch b{color:var(--blue);min-width:46px;font-variant-numeric:tabular-nums}
.ch.cur{font-weight:700}
.ch.done{color:var(--mut)}
.set{display:grid;gap:10px}
.si{display:flex;align-items:center;gap:10px;justify-content:space-between}
.si span{font-weight:700}

.dep{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.dep .m{font-size:24px;font-weight:700;color:var(--blue);min-width:68px}

.stops .st{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.stops .st.past{color:var(--mut)}.stops .st.now{font-weight:700;color:var(--blue)}
#toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:12px;font-size:16px;display:none;z-index:9;max-width:528px;margin:0 auto}

#vc .vl.u{color:var(--mut)}

.small{font-size:14px;color:var(--mut)}
header{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px;max-width:560px;margin:0 auto;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0}header .sub{margin:0;font-size:14px}
button.round{border-radius:24px;padding:10px 18px}
main{padding-bottom:150px}
section{display:none}section.on{display:block}
h2{font-size:24px;margin:10px 0 10px}h3{font-size:21px;margin:6px 0}

.nw{padding:12px 0;border-top:1px solid var(--line)}.nw .t{font-weight:700;font-size:18px;line-height:1.3}.nw .q{font-size:14px;color:var(--blue);font-weight:700;margin:2px 0 4px}.nw p{margin:4px 0 0;line-height:1.5}
.nsec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:18px 0 2px}
#tabs button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 4px 0 var(--blue)}
.fab{position:fixed;right:16px;bottom:78px;z-index:7;width:64px;height:64px;border-radius:50%;background:var(--blue);border:0;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,40,255,.35)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.fr{flex:none;border:2px solid var(--ink);border-radius:20px;padding:6px 12px;font-size:15px;white-space:nowrap}.fr.hot{border-color:var(--blue);color:var(--blue)}
.card.warn{border-color:var(--blue);background:var(--soft)}
.opts{display:grid;gap:8px;margin-top:10px}
.it{display:grid;grid-template-columns:56px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;cursor:pointer}
.it .t{color:var(--blue);font-variant-numeric:tabular-nums}.it .ti{font-weight:600}.it .kd{font-size:12px;color:var(--mut)}
.it.k-fix .kd,.wl.k-fix b{color:var(--ink)}.it.done .ti,.tk.done .tt>div:first-child{text-decoration:line-through;color:var(--mut)}
.de{font-size:14px;color:var(--mut)}
.wbox{border:2px solid var(--blue);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}
.okb{font-size:13px;color:var(--blue);font-weight:700}.nob{font-size:13px;color:var(--red);font-weight:700}
.wait{font-size:12px;background:var(--blue);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700;vertical-align:middle}
.stand{font-weight:400;letter-spacing:0;text-transform:none}
.tk{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tk .tt{flex:1;cursor:pointer}.tk .tb{display:flex;gap:6px}.tk .tb button{padding:6px 8px;font-size:13px;border-width:1px}
.chk{width:30px;height:30px;padding:0;border-radius:8px;flex:none;color:var(--blue);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{padding:6px 10px;font-size:14px;border-width:1px;border-radius:16px;color:var(--mut)}.chip.on{border-color:var(--blue);color:var(--blue);font-weight:700}
.wd{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.wh{margin-bottom:4px}.wh b{font-size:19px}.mk{font-size:13px;color:var(--blue)}
.wl{font-size:16px;padding:2px 0}.wl b{color:var(--blue);display:inline-block;min-width:48px;font-variant-numeric:tabular-nums}
.back{border:0;padding:6px 0;color:var(--blue);font-weight:700}
.ev{color:var(--mut)}
.li{padding:8px 0;border-top:1px solid var(--line)}
.link{border:0;padding:8px 0;color:var(--blue);font-weight:700}
.wide{width:100%;margin:8px 0}
.tap{cursor:pointer}
#sheet{display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35)}
.sh-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 28px;max-width:560px;margin:0 auto}
.sh-in .x{float:right;border:0;color:var(--blue);font-weight:700;padding:4px}
input,textarea{font:inherit;width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px;margin:6px 0;background:#fff;color:var(--ink)}
input[type=range]{border:0;padding:0;accent-color:var(--blue)}
.sl{display:block;font-size:15px;margin-top:8px}
.btnl{display:inline-block;margin-top:8px;font-weight:700}
.si{margin-top:8px}
.err{color:var(--red)}
</style>

<header><div><h1 id="title">Inka</h1><div class="sub" id="subt">Dein Tag</div></div><button class="pri round" id="hinka">Inka</button></header>
<main>
  <section id="t-jetzt"><div id="setup"></div><div id="fristen"></div><div id="konf"></div><div id="next"></div><div id="show"></div><div id="overdue"></div><div id="sent"></div></section>

<script>
"use strict";
const APPV="1.11. 08:20 (Spotify-App bei dunklem Bildschirm)";
/* ---------- Grundlagen ---------- */
const RAW="https://raw.githubusercontent.com/FelixPfahl/theidealcity/inka/";
const SP_CLIENT="aa813e25970f4abd874c4cb71bd7bd01";
const AGENT_DEFAULT="agent_0201m64fk5bkfstr5gkhm6rat739";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");
const hm=d=>d?pad2(d.getHours())+":"+pad2(d.getMinutes()):"";
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+pad2(s%60);};
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const store={get(k,d){try{const v=localStorage.getItem("inka:"+k);return v==null?d:JSON.parse(v);}catch(_){return d;}},set(k,v){try{localStorage.setItem("inka:"+k,JSON.stringify(v));}catch(_){}}};
let toastT=null;
function toast(m,ms){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display="none";},ms||4500);}
const AUD=$("#aud");try{AUD.volume=JSON.parse(localStorage.getItem("inka:vol")||"0.6");}catch(_){AUD.volume=0.6;}
const MOBILE=/Android|iPhone|iPad/i.test(navigator.userAgent);

/* ---------- Schluessel (kommt einmal ueber den Link #k=..., bleibt im Handy) ---------- */
const KEY={raw:"",key:null};
(function(){
  const m=/[#&]k=([A-Za-z0-9_\-]{40,})/.exec(location.hash||"");
  if(m){store.set("key",m[1]);try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}}
  KEY.raw=store.get("key","");
})();
const b64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);};
async function cryptoKey(){if(KEY.key)return KEY.key;if(!KEY.raw)throw new Error("kein Schlüssel");KEY.key=await crypto.subtle.importKey("raw",b64u(KEY.raw),"AES-GCM",false,["encrypt","decrypt"]);return KEY.key;}
async function openEnv(env){const k=await cryptoKey();const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},k,b64(env.ct));return JSON.parse(new TextDecoder().decode(pt));}
async function sealEnv(obj){const k=await cryptoKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {v:1,iv:tob64(iv),ct:tob64(ct)};}

/* ---------- Show laden ---------- */
const S={doc:null,day:"",err:"",loading:"",audioUrl:"",ch:-1,songDone:{},ended:false};
async function fetchDoc(day){
  const r=await fetch(RAW+"d/"+day+".json?t="+Date.now(),{cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error("Daten "+r.status);
  return await openEnv(await r.json());
}
async function loadShow(){
  if(!KEY.raw){S.err="";render();return;}
  const now=new Date(),today=ymd(now),tom=ymd(addD(now,1));
  const order=now.getHours()>=17?[tom,today]:[today];
  S.loading="Show wird geladen";render();
  try{
    let doc=null;
    for(const d of order){doc=await fetchDoc(d);if(doc)break;}
    S.loading="";
    if(!doc){S.doc=null;S.err="Für heute liegt noch keine Show hier. Der Morgenlauf legt sie gegen 4:30 Uhr ab.";render();return;}
    if(!S.doc||S.doc.day!==doc.day||S.doc.published!==doc.published){S.doc=doc;S.day=doc.day;S.songDone={};S.ended=false;S.ch=-1;if(S.audioUrl){URL.revokeObjectURL(S.audioUrl);S.audioUrl="";AUD.removeAttribute("src");}}
    S.err="";render();
  }catch(e){S.loading="";S.err=String(e&&e.message||e)==="kein Schlüssel"?"":"Laden ging nicht: "+String(e&&e.message||e).slice(0,80)+". Schlüssel-Link noch einmal öffnen?";render();}
}
async function ensureAudio(){
  if(S.audioUrl)return true;if(!S.doc||!S.doc.audio)return false;
  S.loading="Audio wird geladen";render();
  try{
    const r=await fetch(RAW+"d/"+S.doc.day+".bin?t="+(S.doc.published||0));if(!r.ok)throw new Error("Audio "+r.status);
    const buf=new Uint8Array(await r.arrayBuffer());const k=await cryptoKey();
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},k,buf.slice(12));
    S.audioUrl=URL.createObjectURL(new Blob([pt],{type:"audio/mp4"}));AUD.src=S.audioUrl;S.loading="";render();return true;
  }catch(e){S.loading="";S.err="Audio ging nicht: "+String(e&&e.message||e).slice(0,80);render();return false;}
}
const chapters=()=>(S.doc&&Array.isArray(S.doc.chapters))?S.doc.chapters:[];
function chAt(t){const c=chapters();let k=-1;for(let i=0;i<c.length;i++)if(t>=c[i].start-0.05)k=i;return k;}
function songIndex(k){let n=0;const c=chapters();for(let i=0;i<k;i++)if(c[i].type==="song")n++;return n;}

/* ---------- Abspielen ---------- */
/* Wachhalter (Josef 1.11.2026: Songs brachen bei ausgeschaltetem Bildschirm nach gut einer Minute ab).
   Die Seite gibt waehrend der Show ein unhoerbar leises Rauschen aus; so gilt sie fuer Android als "spielt Ton" und wird nicht gedrosselt. */
const KEEP={ctx:null,src:null};
KEEP.on=function(){try{
  if(!KEEP.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;KEEP.ctx=new C();}
  if(KEEP.ctx.state!=="running")KEEP.ctx.resume().catch(()=>{});
  if(KEEP.src)return;const sr=KEEP.ctx.sampleRate,b=KEEP.ctx.createBuffer(1,sr*2,sr),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.0012;
  const src=KEEP.ctx.createBufferSource();src.buffer=b;src.loop=true;src.connect(KEEP.ctx.destination);src.start();KEEP.src=src;
}catch(e){diag("wach-fehler",{e:String(e&&e.message||e)});}};
KEEP.off=function(){try{if(KEEP.src){KEEP.src.stop();KEEP.src.disconnect();KEEP.src=null;}}catch(_){}};
async function playShow(){
  SP.unlock();KEEP.on();
  if(!(await ensureAudio()))return;
  if(SONG.on){await SONG.finish("weiter");return;}
  if(S.ended){AUD.currentTime=0;S.ended=false;S.songDone={};}
  try{await AUD.play();}catch(e){toast("Noch einmal auf Play tippen.");}
  SP.warm();
}
function pauseShow(){if(SONG.on){SONG.finish("pause",true);}AUD.pause();KEEP.off();}
function seekCh(k){const c=chapters()[k];if(!c)return;if(SONG.on)SONG.finish("sprung",true);
  ensureAudio().then(ok=>{if(!ok)return;S.songDone={};for(let i=0;i<k;i++)S.songDone[i]=true;AUD.currentTime=c.type==="song"?c.start+1.02:c.start;AUD.play().catch(()=>{});});}
function nextCh(){const k=SONG.on?SONG.k:chAt(AUD.currentTime);if(SONG.on){SONG.finish("weiter");return;}const c=chapters();for(let i=k+1;i<c.length;i++){if(c[i].type==="talk"){seekCh(i);return;}}AUD.currentTime=Math.max(0,(AUD.duration||1)-0.5);}
function prevCh(){const k=chAt(AUD.currentTime);const c=chapters();for(let i=k-(AUD.currentTime-(c[k]?c[k].start:0)<4?1:0);i>=0;i--){if(c[i].type==="talk"){seekCh(i);return;}}}
AUD.addEventListener("timeupdate",()=>{
  const t=AUD.currentTime,k=chAt(t),c=chapters()[k];
  if(c&&c.type==="song"&&!S.songDone[k]&&!SONG.on&&!AUD.paused){S.songDone[k]=true;SONG.start(k);}
  if(k!==S.ch){S.ch=k;meta();renderShow();}
  bar();
});
AUD.addEventListener("play",()=>{KEEP.on();render();meta();});
AUD.addEventListener("pause",()=>{render();if(!SONG.on&&document.hidden&&!AUD.ended)diag("inka-angehalten",{t:Math.round(AUD.currentTime),vis:document.visibilityState});});
["stalled","waiting","error","suspend"].forEach(ev=>AUD.addEventListener(ev,()=>{if(!AUD.paused&&ev!=="suspend"||ev==="error")diag("inka-"+ev,{t:Math.round(AUD.currentTime),vis:document.visibilityState,rs:AUD.readyState});}));
AUD.addEventListener("ended",()=>{KEEP.off();S.ended=true;render();if(store.get("autochat",true))setTimeout(()=>VC.start(true),900);});
function meta(){try{if(!("mediaSession" in navigator))return;const c=chapters()[S.ch];
  navigator.mediaSession.metadata=new MediaMetadata({title:SONG.on&&SONG.track?SONG.track.name:(c?c.title:"Morning-Show"),artist:SONG.on&&SONG.track?SONG.track.artist:"Inka",album:"Morning-Show "+(S.doc?S.doc.day:"")});}catch(_){}}
try{if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",()=>playShow());
  navigator.mediaSession.setActionHandler("pause",()=>pauseShow());
  navigator.mediaSession.setActionHandler("nexttrack",()=>nextCh());
  navigator.mediaSession.setActionHandler("previoustrack",()=>prevCh());
}}catch(_){}

/* ---------- Songs: Seite pausiert, Spotify spielt, danach weiter mit Inka ---------- */
/* Fehlersuche: kurze Zustandsmeldungen verschluesselt ans Sekretariat (nur Technik, keine Inhalte) */
function diag(ev,d){try{const m=Object.assign({ev,ua:MOBILE?"mobil":"desktop",s:Math.round((Date.now()-(SONG.started||Date.now()))/1000)},d||{});console.log("[inka]",ev,m);sendSek("diag",m).catch(()=>{});}catch(_){}}
const SONG={on:false,k:-1,track:null,timer:null,poll:null,started:0,via:""};
SONG.start=async function(k){
  const list=(S.doc&&Array.isArray(S.doc.songs))?S.doc.songs:[];const tr=list[songIndex(k)];
  if(!tr||!SP.ready()){diag("song-uebersprungen",{tr:!!tr,sp:SP.ready()});if(!SP.ready()&&tr)toast("Musik übersprungen: Spotify noch nicht verbunden.");return;}

const MVG="https://www.mvg.de/api/bgw-pt/v3";
const HOME={lat:48.15582,lon:11.56154};
const D={pos:null,src:"",watch:null,near:[],trip:null,routes:[],err:"",at:0,timer:null,open:false,ride:false,chosen:null,dest:null};
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
D.locate=function(){

  diag("dep-standort-start",{});
  D.watch=navigator.geolocation.watchPosition(p=>{const first=!D.pos||D.src!=="Standort";if(first)diag("dep-standort",{acc:Math.round(p.coords.accuracy)});D.pos={lat:p.coords.latitude,lon:p.coords.longitude};D.src="Standort";if(first)D.refresh();else D.detect();},
    e=>{diag("dep-standort-fehler",{code:e&&e.code,msg:String(e&&e.message||"")});if(!D.pos||D.src!=="Standort"){D.pos=HOME;D.src="zu Hause (Standort nicht erlaubt)";D.refresh();}},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});

D.tripNow=function(){
  const today=ymd(new Date());const tr=(S.doc&&S.doc.day===today&&Array.isArray(S.doc.trips)&&S.doc.trips.length)?S.doc.trips:((APP.data&&APP.data.trips&&APP.data.trips[today])||[]);if(!tr.length)return null;const now=Date.now();

  return list.find(t=>now>=t.start-45*60000&&now<=t.end.getTime()+20*60000)||null;

D.refresh=async function(){
  clearTimeout(D.timer);if(!D.pos)return;
  try{
    const nb=await (await fetch(MVG+"/stations/nearby?latitude="+D.pos.lat+"&longitude="+D.pos.lon)).json();

    const all=[];
    await Promise.all(st.map(async s=>{try{const r=await fetch(MVG+"/departures?globalId="+encodeURIComponent(s.globalId)+"&limit=6&transportTypes=UBAHN,TRAM,BUS,SBAHN");const j=await r.json();
      (Array.isArray(j)?j:[]).forEach(x=>all.push({station:s.name,m:s.distanceInMeters,label:x.label,dest:x.destination,type:x.transportType,plan:x.plannedDepartureTime,real:x.realtimeDepartureTime||x.plannedDepartureTime,delay:x.delayInMinutes||0,cancel:!!x.cancelled,rt:!!x.realtime}));}catch(_){}}));
    const now=Date.now();const walk=x=>Math.round((x.m||0)/80)*60000;
    D.near=all.filter(x=>x.real-now>walk(x)-60000&&!x.cancel).sort((a,b)=>a.real-b.real).filter((x,i,arr)=>arr.findIndex(y=>y.label===x.label&&y.dest===x.dest)===i).slice(0,3);
    D.trip=D.tripNow();D.routes=[];
    if(D.trip){if(!D.dest||D.dest.q!==D.trip.dest){const lj=await (await fetch(MVG+"/locations?query="+encodeURIComponent(D.trip.dest))).json();const hit=(lj||[]).find(x=>x.latitude)||null;D.dest=hit?{q:D.trip.dest,lat:hit.latitude,lon:hit.longitude}:null;}
      if(D.dest){const u=MVG+"/routes?"+new URLSearchParams({originLatitude:D.pos.lat,originLongitude:D.pos.lon,destinationLatitude:D.dest.lat,destinationLongitude:D.dest.lon,routingDateTime:new Date().toISOString(),routingDateTimeIsArrival:"false",transportTypes:"UBAHN,TRAM,BUS,SBAHN,BAHN"});

function normRoute(r){

function rideInfo(){

/* Eintraege eines Tages: Wochendaten, sonst die Eintraege aus der Show */
function dayEntries(day){

  else if(S.doc&&S.doc.day===day)list=(S.doc.entries||[]).filter(e=>e.kind!=="task").map(e=>Object.assign({date:day},e,{start:/^\d/.test(e.start||"")?e.start:"",end:/^\d/.test(e.end||"")?e.end:""}));

}
function dayTasks(day){return allTasks().filter(t=>t.date===day&&!t.overdue);}

/* Auftraege ans Sekretariat, mit "wartet"-Markierung bis zur naechsten Datenlieferung */
function pendList(){return store.get("pend",[]);}
function prunePend(){store.set("pend",pendList().filter(p=>Date.now()-p.t<36*3600e3));}
function pendFor(key){const made=(APP.data&&APP.data.made)||0;return pendList().filter(p=>p.key===key&&!(QUIT[p.id]&&QUIT[p.id].ok&&made>p.t));}
/* Quittungen des Sekretariats (verschluesselt ueber denselben Kanal) */
const QUIT=store.get("quit",{});
async function loadQuit(){const tp=topic();if(!tp)return;
  try{const r=await fetch("https://ntfy.sh/"+tp+"/json?poll=1&since=36h");const txt=await r.text();let ch=false;
    for(const line of txt.split("\n")){if(!line.trim())continue;let m;try{m=JSON.parse(line);}catch(_){continue;}if(m.event!=="message")continue;
      let body=m.message;if(m.attachment&&m.attachment.url){try{body=await (await fetch(m.attachment.url)).text();}catch(_){continue;}}
      let env;try{env=JSON.parse(body);}catch(_){continue;}if(!env.ct)continue;
      let d;try{d=await openEnv(env);}catch(_){continue;}
      if(d.from==="sekretariat"&&d.kind==="quittung"&&d.re&&!QUIT[d.re]){QUIT[d.re]={ok:d.ok!==false,text:d.text||"",t:d.t||Date.now()};ch=true;}}
    if(ch){store.set("quit",QUIT);render();}
  }catch(_){}}

  catch(e){toast("Senden ging nicht: "+String(e&&e.message||e).slice(0,60),7000);return false;}
}
const addDays=(day,n)=>ymd(addD(dOf(day),n));
function moveTask(t,day){return auftrag("verschieben",{key:t.key,neu_datum:day,neu_start:t.time||""},"verschieben: "+t.title+" auf "+dlabel(day)+(t.time?" "+t.time:""),t.key);}

  h+='<div class="k" style="margin-top:14px">Projekte</div>'+((A.projects||[]).map(p=>'<div class="card"><div class="now">'+esc(p.name)+'</div>'+(p.stand?'<div><span class="small">Stand</span> '+esc(p.stand)+'</div>':"")+(p.next?'<div><span class="small">Nächster Schritt</span> <b>'+esc(p.next)+'</b></div>':"")+(p.frist?'<div><span class="small">Frist</span> '+esc(p.frist)+'</div>':"")+(p.quelle?'<div class="small">'+esc(p.quelle)+'</div>':"")+'</div>').join("")||'<div class="small">Noch keine Projektdaten.</div>');
  h+='<div class="card"><div class="k">Post, braucht Antwort</div>'+((A.mails||[]).map(m=>'<div class="li"><b>'+esc(m.from)+'</b> · '+esc(m.subject)+'<div class="de">'+esc([m.since?"seit "+m.since:"",m.why].filter(Boolean).join(" · "))+'</div></div>').join("")||'<div class="small">Nichts offen.</div>')+'<div class="small">Antworttexte formuliere ich dir im Sekretär-Chat.</div></div>';
  h+='<div class="card"><div class="k">Warteschleife</div>'+((A.waiting||[]).map(w=>'<div class="li"><b>'+esc(w.who)+'</b>: '+esc(w.what)+(w.since?' <span class="small">seit '+esc(w.since)+'</span>':"")+'</div>').join("")||'<div class="small">Du wartest auf nichts.</div>')+'</div>';
  const vol=store.get("vol",0.6);
  h+='<div class="card"><div class="k">Einstellungen</div>'+
    '<label class="sl">Lautstärke Inka im Verhältnis zur Musik: <b id="volv">'+Math.round(vol*100)+'%</b></label><input type="range" id="vol" min="0.2" max="1" step="0.05" value="'+vol+'">'+
    '<div class="si"><span>Gespräch nach der Show</span><button id="fauto">'+(store.get("autochat",true)?"an":"aus")+'</button></div>'+
    '<div class="si"><span>Einrichtung (Spotify, Mikro, Standort)</span><button id="fset">zeigen</button></div>'+
    '<div class="si"><span>Daten neu laden</span><button id="frel">laden</button></div>'+
    '<div class="small" style="margin-top:8px"><a href="https://claude.ai/artifact/EkNqxBBfUr4tsNZhP9NvUN" target="_blank" rel="noopener">Sekretariat-App in claude.ai (Reserve)</a></div></div>';
  h+='<div class="small" style="margin:8px 0 20px">App-Stand: '+esc(APPV)+'</div>';
  $("#t-ueberblick").innerHTML=h;
  const v=$("#vol");v.oninput=()=>{store.set("vol",+v.value);AUD.volume=+v.value;$("#volv").textContent=Math.round(v.value*100)+"%";};
  $("#fauto").onclick=()=>{store.set("autochat",!store.get("autochat",true));render();};
  $("#fset").onclick=()=>{store.set("showSetup",true);setTab("jetzt");};
  $("#frel").onclick=()=>{loadApp();loadShow();toast("Lade neu …");};
}

/* ---------- Sheet: Eintrag, neue Aufgabe, Diktat ---------- */
function openSheet(h){const s=$("#sheet");s.innerHTML='<div class="sh-in"><button class="x" data-close="1">Schließen</button>'+h+'</div>';s.style.display="block";}
function closeSheet(){const s=$("#sheet");s.style.display="none";s.innerHTML="";if(DIK.rec){try{DIK.rec.stop();}catch(_){}}}
function sheetItem(key){
  const e=findAny(key);if(!e)return;const isTask=key.startsWith("t|")||e.kind==="task";const kind=isTask?"task":e.kind;
  const day=e.date||ymd(new Date());
  let h='<div class="k">'+esc(KIND[kind]||"")+(e.date?" · "+esc(dlabel(e.date)):"")+'</div><h3>'+esc(e.title)+'</h3>';
  h+='<div>'+esc([e.start||e.time||"",e.end?"bis "+e.end:""].filter(Boolean).join(" "))+'</div>';
  if(e.loc)h+='<div class="de">'+esc(e.loc)+'</div><a class="btnl" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(e.loc)+'&travelmode=transit">Weg in Google Maps</a>';
  if(e.note)h+='<div class="de" style="margin-top:6px">'+esc(e.note)+'</div>';
  pendFor(key).forEach(p=>{h+='<div class="small">Wartet: '+esc(p.text)+'</div>';});
  if(MOVABLE(kind)){
    h+='<div class="k" style="margin-top:14px">Verschieben</div><div class="row"><input type="date" id="mvd" value="'+esc(day)+'"><input type="time" id="mvt" value="'+esc(e.start||e.time||"")+'"></div><button class="pri wide" id="mvgo">Verschieben</button>';
    if(isTask)h+='<div class="row" style="margin-top:10px"><button id="tdone">Erledigt</button><button id="ttom">Morgen</button><button id="tweek">Nächste Woche</button></div>';
  }else h+='<div class="small" style="margin-top:12px">Fester Eintrag, wird nicht verschoben.</div>';
  openSheet(h);
  const t={key,title:e.title,time:e.start||e.time||"",date:day};
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f;};
  on("mvgo",()=>{const d=$("#mvd").value,tm=$("#mvt").value;if(!d){toast("Datum fehlt.");return;}auftrag("verschieben",{key,neu_datum:d,neu_start:tm},"verschieben: "+e.title+" auf "+dlabel(d)+(tm?" "+tm:""),key);});
  on("tdone",()=>doneTask(t));on("ttom",()=>moveTask(t,addDays(ymd(new Date()),1)));on("tweek",()=>moveTask(t,addDays(ymd(new Date()),7)));
}
function sheetNewTask(){
  openSheet('<h3>Neue Aufgabe</h3><input id="nt" placeholder="Was ist zu tun?" autocomplete="off"><div class="row"><input type="date" id="nd" value="'+ymd(new Date())+'"><input type="time" id="nh"></div><label class="sl">Dauer in Minuten</label><input type="number" id="nm" value="30" min="5" step="5"><button class="pri wide" id="ngo">Anlegen</button><div class="small">Mit Uhrzeit trägt das Sekretariat auch einen Block in „misc“ ein, wenn er frei ist.</div>');
  $("#ngo").onclick=()=>{const tx=$("#nt").value.trim();if(!tx){toast("Text fehlt.");return;}const d=$("#nd").value,tm=$("#nh").value,du=+$("#nm").value||null;
    auftrag("aufgabe_anlegen",{text:tx,datum:d,uhrzeit:tm,dauer_min:du},"anlegen: "+tx+" am "+dlabel(d)+(tm?" um "+tm:""),"");};
}
/* Diktat: Spracherkennung von Chrome, Text pruefen, Projekt antippen, ans Sekretariat */
const DIK={rec:null,txt:"",tag:store.get("diktTag","Sekretariat")};
const PROJ=["Sekretariat","Unterricht","Kunst und Comics","Französisch","Kochen"];
function sheetDiktat(){
  openSheet('<h3>Diktat</h3><textarea id="dk" rows="5" placeholder="Sprich jetzt oder tippe …"></textarea><div class="chips">'+PROJ.map(p=>'<button class="chip'+(p===DIK.tag?" on":"")+'" data-dtag="'+esc(p)+'">'+esc(p)+'</button>').join("")+'</div>'+
    '<div class="row"><button id="dkmic">● Aufnahme</button><button class="pri" id="dkgo">Senden</button></div><div class="small" id="dkst"></div>');
  $("#dkgo").onclick=()=>{const tx=$("#dk").value.trim();if(!tx){toast("Noch kein Text.");return;}auftrag("notiz",{text:tx,tag:DIK.tag},"Notiz ("+DIK.tag+"): "+tx.slice(0,60),"");};
  $("#dkmic").onclick=()=>dikStart();dikStart();
}
function dikStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const st=$("#dkst");
  if(!SR){if(st)st.textContent="Spracherkennung fehlt: tippe oder nutze das Mikro der Tastatur.";return;}
  if(DIK.rec){try{DIK.rec.stop();}catch(_){}DIK.rec=null;if(st)st.textContent="Aufnahme aus.";return;}
  const r=new SR();r.lang="de-DE";r.continuous=true;r.interimResults=true;DIK.rec=r;const base=($("#dk").value||"").trim();
  r.onresult=ev=>{let fin="",tmp="";for(let i=0;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript;}const ta=$("#dk");if(ta)ta.value=(base?base+" ":"")+fin+tmp;};
  r.onerror=e=>{if(st)st.textContent="Spracherkennung: "+(e.error||"Fehler");};
  r.onend=()=>{DIK.rec=null;const s2=$("#dkst");if(s2)s2.textContent="Aufnahme beendet. Text prüfen, Projekt wählen, senden.";const b=$("#dkmic");if(b)b.textContent="● Aufnahme";};
  try{r.start();if(st)st.textContent="Ich höre zu …";const b=$("#dkmic");if(b)b.textContent="■ Stopp";}catch(e){if(st)st.textContent="Start ging nicht: "+e.message;}
}

/* ---------- Reiter-Steuerung ---------- */
function setTab(t){TAB.cur=t;store.set("tab",t);if(t!=="woche")TAB.day="";if(t==="unterwegs"&&!D.open){D.open=true;D.locate();}render();window.scrollTo(0,0);}
document.addEventListener("click",ev=>{
  const g=ev.target.closest("[data-gotab]");if(g){setTab(g.dataset.gotab);return;}
  const ns=ev.target.closest("[data-nsel]");if(ns){NEWS.sel=+ns.dataset.nsel;NEWS.sec="";store.set("newssel",NEWS.sel);renderNachrichten();return;}
  const nc=ev.target.closest("[data-nsec]");if(nc){NEWS.sec=nc.dataset.nsec;renderNachrichten();return;}
  const od=ev.target.closest("[data-openday]");if(od){TAB.day=od.dataset.openday;TAB.cur="woche";store.set("tab","woche");render();window.scrollTo(0,0);return;}
  if(ev.target.closest("[data-back]")){TAB.day="";render();return;}
  const f=ev.target.closest("[data-filter]");if(f){const k=f.dataset.filter;FILTER=FILTER.includes(k)?FILTER.filter(x=>x!==k):FILTER.concat([k]);store.set("filter",FILTER);render();return;}
  const td=ev.target.closest("[data-tdone]");if(td){const t=allTasks().find(x=>x.key===td.dataset.tdone);if(t&&!pendFor(t.key).some(p=>p.tool==="erledigen"))doneTask(t);return;}
  const tm=ev.target.closest("[data-tmove]");if(tm){const t=allTasks().find(x=>x.key===tm.dataset.tmove);if(t)moveTask(t,addDays(ymd(new Date()),+tm.dataset.to));return;}
  const kf=ev.target.closest("[data-konf]");if(kf){const c=((APP.data&&APP.data.conflicts)||[]).find(x=>x.id===kf.dataset.konf);const o=c&&c.options&&c.options[+kf.dataset.opt];
    if(o)auftrag("konflikt",{id:c.id,label:o.label,auftrag:o.auftrag||o.label,text:c.text},"Konflikt: "+o.label,"konf|"+c.id);return;}
  const it=ev.target.closest("[data-key]");if(it&&!ev.target.closest("button")){sheetItem(it.dataset.key);return;}
  const tk=ev.target.closest("[data-task]");if(tk&&!ev.target.closest("button")){sheetItem(tk.dataset.task);return;}
  if(ev.target.closest("[data-newtask]")){sheetNewTask();return;}
  const dt=ev.target.closest("[data-dtag]");if(dt){DIK.tag=dt.dataset.dtag;store.set("diktTag",DIK.tag);document.querySelectorAll("[data-dtag]").forEach(b=>b.classList.toggle("on",b.dataset.dtag===DIK.tag));return;}
  if(ev.target.closest("[data-close]")){closeSheet();return;}
});

function render(){
  document.querySelectorAll("section").forEach(x=>x.classList.toggle("on",x.id==="t-"+TAB.cur));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB.cur));
  if(!KEY.raw){TAB.cur="jetzt";document.querySelectorAll("section").forEach(x=>x.classList.toggle("on",x.id==="t-jetzt"));renderSetup();return;}
  try{if(TAB.cur==="jetzt"){renderSetup();renderJetzt();renderShow();renderSent();
    const sec=$("#t-jetzt"),sh=$("#show"),morning=new Date().getHours()<12&&S.doc&&!S.ended;if(morning&&sec.children[1]!==sh)sec.insertBefore(sh,$("#fristen"));if(!morning&&sh.nextElementSibling!==$("#overdue"))sec.insertBefore(sh,$("#overdue"));}
  else if(TAB.cur==="woche")renderWoche();
  else if(TAB.cur==="aufgaben")renderAufgaben();
  else if(TAB.cur==="unterwegs")renderDeps();
  else if(TAB.cur==="nachrichten")renderNachrichten();
  else if(TAB.cur==="ueberblick")renderUeberblick();}catch(e){console.error(e);diag("render-fehler",{tab:TAB.cur,e:String(e&&e.message||e).slice(0,120)});}
  if(!S.doc&&TAB.cur!=="jetzt"){const d=new Date();$("#title").textContent=WD[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+".";}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#hinka").onclick=()=>VC.start();
$("#mic").onclick=()=>sheetDiktat();

/* ---------- Start ---------- */
(async()=>{await SP.handle();await permCheck();render();await Promise.all([loadShow(),loadApp()]);loadQuit();setInterval(()=>{if(!document.hidden)loadQuit();},180000);
  if(D.tripNow()){D.open=true;D.locate();render();}
  document.addEventListener("visibilitychange",()=>{if(document.hidden||SONG.on||VC.conv)return;
    if(AUD.paused)loadShow();
    if(!APP.data||Date.now()-(APP.lastLoad||0)>20*60000){loadApp();loadQuit();}});
  setInterval(()=>{if(!document.hidden)renderJetztLight();},30000);
})();
</script>
