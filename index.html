<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: ein Blick auf heute, darunter große Kacheln für jede App. Dunkel, ein Blau. */
:root{
  --bg:#0b0c10; --surface:#15171d; --line:#262a33; --fg:#eceef3; --muted:#8b91a0;
  --accent:#0028ff; --accent-text:#8296ff;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:clamp(44px,14vw,72px);font-weight:800;font-stretch:70%;letter-spacing:-.01em;line-height:1}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-stretch:80%;font-size:22px;color:var(--muted)}
.date{color:var(--muted);font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin-top:8px}
.today{margin-top:22px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.today .k{color:var(--muted);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.today .v{font-size:24px;font-weight:700;margin-top:4px;text-wrap:balance}
.today .v b{color:var(--accent-text);font-variant-numeric:tabular-nums}
.today .s{color:var(--muted);font-size:15px;margin-top:4px}
.grid{display:grid;gap:12px;margin-top:22px}
@media (min-width:760px){.wrap{max-width:820px}.grid{grid-template-columns:1fr 1fr}}
.tile{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:96px;position:relative}
.tile:focus-visible,.alt:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.tile .n{font-size:32px;font-weight:800;font-stretch:75%;line-height:1}
.tile .d{color:var(--muted);font-size:16px;margin-top:6px}
.tile.live{border-color:var(--accent)}
.tile .badge{position:absolute;top:16px;right:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.alt{display:inline-block;margin:8px 0 0 4px;color:var(--muted);font-size:14px}
.foot{margin-top:32px;font-size:13px;color:var(--muted)}
.help{display:block;margin-top:22px;color:var(--accent-text);font-size:17px;font-weight:600;text-decoration:none}
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:7;height:44px;display:flex;background:#07080b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.appbar a{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:15px;font-weight:600}
.appbar a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
body.has-appbar .wrap{padding-bottom:90px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Atelier</h1><span class="clock" id="clock">--.--</span></div>
  <div class="date" id="date"></div>
  <section class="today" aria-live="polite">
    <div class="k" id="tk">Heute</div>
    <div class="v" id="tv">Lade den Tag ...</div>
    <div class="s" id="ts"></div>
  </section>
  <nav class="grid" id="apps" aria-label="Apps"></nav>
  <a class="help" href="anleitung.html">Anleitung: Installieren, Koppeln, Bedienen ›</a>
  <p class="foot">Erstellt mit Unterstützung von Claude (KI-Assistent von Anthropic).</p>
</div>
<script>
/* Neue Apps hier eintragen: Name, wofür, Link ohne Anmeldung, Link in Claude */
const APPS = [
  {id:"pult", n:"Pult", d:"Im Unterricht: Phase, Restzeit, Spickzettel", web:"https://raw.githack.com/FelixPfahl/theidealcity/pult/index.html", claude:"https://claude.ai/artifact/PtrmwGZWHN8FpjA8t6w5cP"},
  {id:"morgenrunde", n:"Morgenrunde", d:"Auf dem Schulweg: Quiz zum Tag", web:"https://raw.githack.com/FelixPfahl/theidealcity/morgenrunde/morgenrunde/web/index.html", claude:"https://claude.ai/artifact/ERAHwi2MdJkdHW2Unc5inF"},
  {id:"folien", n:"Folien", d:"Am PC vorführen, am Handy fernsteuern", web:"https://raw.githack.com/FelixPfahl/theidealcity/folien/index.html"}
];
/* Ersatz gibt es keinen mehr im Klartext: ohne Netz zeigt Atelier den letzten Stand auf diesem Gerät */
const FALLBACK = null;
/* Atelier-Schlüssel: Verschlüsselung der Tagesdaten und der Kopplung (AES-GCM, Schlüssel per PBKDF2 aus dem 16-stelligen Atelier-Schlüssel).
   Der Schlüssel liegt nur auf Josefs Geräten (localStorage) und wird nie über das Netz geschickt. */
const Geheim = (() => {
  const te = new TextEncoder(), td = new TextDecoder();
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const cache = {};
  async function key(s, salt){
    const id = salt + ":" + norm(s); if (cache[id]) return cache[id];
    const base = await crypto.subtle.importKey("raw", te.encode(norm(s)), "PBKDF2", false, ["deriveKey"]);
    return cache[id] = await crypto.subtle.deriveKey({name:"PBKDF2", salt: te.encode(salt), iterations: 150000, hash: "SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]);
  }
  async function open(box, s, salt){
    const k = await key(s, salt || "atelier-daten-v1");
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(box.iv)}, k, unb64(box.ct));
    return JSON.parse(td.decode(pt));
  }
  async function seal(obj, s, salt){
    const k = await key(s, salt || "atelier-daten-v1");
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, te.encode(JSON.stringify(obj))));
    return {v:1, iv: b64(iv), ct: b64(ct)};
  }
  async function topic(s){
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode("atelier-topic-v1:" + norm(s))));
    return "atelier-" + Array.from(h.slice(0, 12), b => b.toString(16).padStart(2, "0")).join("");
  }
  const get = () => { try { return localStorage.getItem("atelier-schluessel") || ""; } catch(e){ return ""; } };
  const set = v => { try { if (v) localStorage.setItem("atelier-schluessel", norm(v)); else localStorage.removeItem("atelier-schluessel"); } catch(e){} };
  const valid = v => norm(v).length === 16;
  const pretty = v => norm(v).toUpperCase().replace(/(.{4})(?=.)/g, "$1-");
  /* Schlüssel aus dem Link-Anker (#s=...) übernehmen; der Anker geht nie an einen Server */
  function fromHash(){
    const m = location.hash.match(/[#&]s=([A-Za-z0-9-]+)/);
    if (m && valid(m[1])){ set(m[1]); try { history.replaceState(null, "", location.pathname + location.search); } catch(e){} return true; }
    return false;
  }
  const isBox = o => !!(o && typeof o === "object" && o.iv && o.ct);
  return {norm, open, seal, topic, get, set, valid, pretty, fromHash, isBox};
})();

Geheim.fromHash();

const IN_APP = (() => { try { return !!(window.AtelierApp && AtelierApp.isApp()); } catch(e){ return false; } })();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt = t => t.replace(":", ".");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let DAY = null;

function renderApps(live){
  document.getElementById("apps").innerHTML = APPS.map(a => `
    <div>
      <a class="tile${live && a.id==="pult" ? " live" : ""}" href="${esc(IN_APP && a.id==="folien" ? PULT_WEB + "?ansicht=fern" : a.web)}" data-app="${a.id}">
        ${live && a.id==="pult" ? '<span class="badge">Läuft</span>' : ""}
        <div class="n">${esc(a.n)}</div><div class="d">${esc(a.d)}</div>
      </a>
      ${IN_APP || !a.claude ? "" : `<a class="alt" href="${esc(a.claude)}" target="_blank" rel="noopener">${esc(a.n)} in Claude öffnen</a>`}
    </div>`).join("");
}

/* In der Handy-App: Kachel wechselt den Reiter (neue App: switchTab; ältere App: der Link selbst wechselt zu Pult bzw. Morgenrunde).
   Folien öffnet am Handy die Fernbedienung in Pult. */
const PULT_WEB = "https://raw.githack.com/FelixPfahl/theidealcity/pult/index.html";
document.addEventListener("click", e => {
  const t = e.target.closest("a.tile[data-app]"); if (!t || !IN_APP) return;
  try {
    if (window.AtelierApp && AtelierApp.switchTab){
      e.preventDefault();
      AtelierApp.switchTab(t.dataset.app === "folien" ? "fern" : t.dataset.app);
    }
  } catch(err){}
});
/* Im Browser: Leiste unten zwischen den Apps */
if (!IN_APP && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  const bar = document.createElement("nav");
  bar.className = "appbar"; bar.setAttribute("aria-label", "Apps");
  bar.innerHTML = '<a aria-current="page" href="index.html">Atelier</a><a href="' + PULT_WEB + '#jetzt">Pult</a><a href="' + PULT_WEB + '#fern">Fernbedienung</a>';
  document.body.appendChild(bar); document.body.classList.add("has-appbar");
}
function renderToday(){
  const now = new Date();
  const days = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  document.getElementById("date").textContent = days[now.getDay()] + ", " + now.getDate() + "." + (now.getMonth()+1) + ".";
  document.getElementById("clock").textContent = now.getHours() + "." + String(now.getMinutes()).padStart(2,"0");
  const tk = document.getElementById("tk"), tv = document.getElementById("tv"), ts = document.getElementById("ts");
  let live = false;
  if (!DAY){
    if (KEYMSG){ tk.textContent = "Schlüssel nötig"; tv.textContent = KEYMSG === "falsch" ? "Der Schlüssel passt nicht" : "Tagesdaten verschlüsselt"; ts.textContent = "Einmal in Pult unter „Tag“ den Atelier-Schlüssel eingeben."; }
    renderApps(false); return;
  }
  if (DAY.datum !== iso(now)){
    tk.textContent = "Heute";
    tv.textContent = "Noch nicht aktualisiert";
    ts.textContent = "Letzter Stand: " + DAY.label + " Kommt mit dem Morgenlauf.";
  } else {
    const min = now.getHours()*60 + now.getMinutes();
    const cur = DAY.termine.find(t => toMin(t.start) <= min && min < toMin(t.ende));
    const next = DAY.termine.find(t => toMin(t.start) > min);
    if (cur){
      live = !!cur.unterricht;
      tk.textContent = "Jetzt";
      tv.innerHTML = `<b>bis ${fmt(cur.ende)}</b> ${esc(cur.titel)}`;
      ts.textContent = next ? "Danach " + fmt(next.start) + " " + next.titel : "Danach nichts mehr eingetragen.";
    } else if (next){
      tk.textContent = "Als Nächstes";
      tv.innerHTML = `<b>${fmt(next.start)}</b> ${esc(next.titel)}`;
      ts.textContent = "in " + (toMin(next.start) - min) + " Min.";
    } else {
      tk.textContent = "Heute";
      tv.textContent = "Alle Termine vorbei";
      ts.textContent = "";
    }
  }
  renderApps(live);
  /* In der Android-App: beim Start immer direkt Pult zeigen (einmal pro Start); die Startseite bleibt über „Heute“ erreichbar */
  try {
    if (window.AtelierApp && AtelierApp.isApp() && !sessionStorage.getItem("autoPult")){
      sessionStorage.setItem("autoPult", "1");
      AtelierApp.openTab("pult");
    }
  } catch(e){}
}

/* Tagesdaten kommen aus Pult (ein Morgenlauf für beide Apps), sonst aus heute.json, sonst Ersatz */
const PULT_DATA = "https://raw.githack.com/FelixPfahl/theidealcity/pult/daten/heute.json";
async function getJson(u){ const r = await fetch(u, {cache:"no-cache"}); if (!r.ok) throw new Error(r.status); return r.json(); }
function fromPult(p){
  return {datum:p.date, label:p.label, termine:(p.items||[]).map(it => ({start:it.start, ende:it.end,
    titel:(it.type==="lesson" ? it.klasse + " " : "") + it.titel, unterricht:it.type==="lesson"}))};
}
/* Tagesdaten sind verschlüsselt; der Atelier-Schlüssel liegt nur auf diesem Gerät (einmal in Pult unter „Tag“ eingeben) */
let KEYMSG = "";
async function unbox(x){
  if (!Geheim.isBox(x)) return x;
  const k = Geheim.get();
  if (!k){ KEYMSG = "fehlt"; throw new Error("kein Schlüssel"); }
  try { const o = await Geheim.open(x, k); KEYMSG = ""; return o; } catch(e){ KEYMSG = "falsch"; throw e; }
}
async function load(){
  let got = null;
  try { got = fromPult(await unbox(await getJson(PULT_DATA))); }
  catch(e){
    try { got = await unbox(await getJson("heute.json")); }
    catch(e2){ got = FALLBACK; }
  }
  if (got){ DAY = got; try { localStorage.setItem("atelier-last", JSON.stringify(DAY)); } catch(e){} }
  renderToday();
}
try { const c = JSON.parse(localStorage.getItem("atelier-last") || "null"); if (c && c.termine) DAY = c; } catch(e){}
renderApps(false);
if (DAY) renderToday();
load();
setInterval(renderToday, 30000);
</script>
</body>
</html>
