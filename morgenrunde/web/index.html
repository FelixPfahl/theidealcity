<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0028ff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Morgenrunde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Shantell+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: ein Comicheft fürs Android-Handy. Jede Frage ist ein Panel mit Sprecherfigur, Antworten sitzen in der Daumenzone,
   der MB ist der Endgegner auf einer Splash-Page. Eine Akzentfarbe, sonst Tusche auf Papier. */
:root{
  --paper:#f3f4f8; --panel:#ffffff; --ink:#111218; --ink-soft:#4a4d5c; --rule:#c9ccd8;
  --accent:#0028ff; --on-accent:#ffffff; --dot:rgba(0,40,255,.16);
  --night:#0b0c12; --night-fg:#f3f4f8; --night-soft:#9ea3b8;
  --f-display:"Anton","Impact","Arial Narrow Bold","Arial Narrow",sans-serif;
  --f-letter:"Shantell Sans","Comic Sans MS","Segoe Print",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --border:3px; --gutter:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e0f15;--panel:#191b25;--ink:#eceef6;--ink-soft:#a5a9bb;--rule:#343849;
  --accent:#5b7bff;--on-accent:#0b0c12;--dot:rgba(91,123,255,.22);
  --night:#000000;--night-fg:#f3f4f8;--night-soft:#9ea3b8;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e0f15;--panel:#191b25;--ink:#eceef6;--ink-soft:#a5a9bb;--rule:#343849;
  --accent:#5b7bff;--on-accent:#0b0c12;--dot:rgba(91,123,255,.22);
  --night:#000000;--night-fg:#f3f4f8;--night-soft:#9ea3b8;color-scheme:dark}

html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:var(--gutter)}
.stack>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter)}
.panel{background:var(--panel);border:var(--border) solid var(--ink);padding:16px;position:relative;min-width:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.notice{font-size:14px;color:var(--ink-soft)}
.hyph{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}

.mast{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,84px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.mast span{color:var(--accent)}
.mast.stacked span{display:block}
.cover{overflow:hidden}
.cover::after{content:"";position:absolute;right:-30px;bottom:-30px;width:170px;height:170px;border-radius:50%;
  background-image:radial-gradient(var(--dot) 28%,transparent 30%);background-size:10px 10px;pointer-events:none}
.issue{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;border-block:2px solid var(--ink);padding-block:6px;margin-block:12px 14px}
.coverhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.coverart{margin:4px 0 14px;position:relative;z-index:1}
.coverart img{display:block;width:100%;max-height:260px;object-fit:contain;background:var(--paper);border:2px solid var(--ink)}
.coverart figcaption{font-size:12px;color:var(--ink-soft);margin-top:6px}
.hook{font-family:var(--f-letter);font-size:19px;line-height:1.3;font-weight:600;position:relative;z-index:1}
.contents{display:flex;flex-direction:column;gap:10px;margin-top:14px;position:relative;z-index:1}
.contents ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.contents li{list-style:none;display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:baseline}
.time{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.also{font-size:14px;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:var(--border) solid var(--ink);padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .mono{font-size:10.5px;letter-spacing:.03em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hot b{color:var(--accent)}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .line{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.rank b{font-family:var(--f-display);font-weight:400;font-size:24px;text-transform:uppercase;line-height:1.05}
.track{height:12px;border:2px solid var(--ink);position:relative;background:var(--panel)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 16px;border:var(--border) solid var(--ink);
  background:var(--panel);font-family:var(--f-display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;width:100%;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.small{min-height:50px;font-size:17px;letter-spacing:.03em;padding:8px}
.btn:active{transform:translate(2px,2px)}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 0 0 6px var(--paper)}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;padding:8px 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.strip{display:grid;gap:3px}
.cell{height:12px;border:2px solid var(--ink);background:var(--panel)}
.cell.ok{background:var(--accent)}
.cell.no{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 5px)}
.cell.now{outline:2px solid var(--accent);outline-offset:1px}
.cell.bosscell{border-style:double;border-width:4px}
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-display);font-size:18px;color:var(--accent);letter-spacing:.04em}
.chapter{background:var(--ink);color:var(--paper);border:var(--border) solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.chapter h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,7vw,30px);line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.chapter .goal{font-size:14px;opacity:.85}
.stage{display:flex;flex-direction:column;gap:var(--gutter);min-height:calc(100svh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);padding:2px 6px;white-space:nowrap}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.lvl{display:inline-flex;gap:3px;margin-left:auto}
.lvl i{width:10px;height:10px;border:2px solid var(--ink);display:block}
.lvl i.on{background:var(--ink)}
.speaker{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:end;margin-top:12px}
.who{display:flex;flex-direction:column;align-items:center;gap:2px}
.who svg{width:64px;height:64px;display:block}
.who span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1}
.balloon{font-family:var(--f-letter);font-size:19px;line-height:1.3;font-weight:600;border:var(--border) solid var(--ink);border-radius:20px;
  padding:14px 16px;background:var(--panel);position:relative;margin-bottom:14px}
.balloon::after{content:"";position:absolute;left:-12px;bottom:14px;width:18px;height:18px;background:var(--panel);
  border-left:var(--border) solid var(--ink);border-bottom:var(--border) solid var(--ink);transform:skewY(30deg) rotate(20deg)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:auto}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;text-align:left;min-height:60px;padding:10px 12px;
  border:var(--border) solid var(--ink);background:var(--panel);font-size:16px;line-height:1.32;width:100%}
.opt .key{font-family:var(--f-display);font-size:20px;width:32px;height:32px;border:2px solid var(--ink);display:grid;place-items:center}
.opt.right{background:var(--accent);color:var(--on-accent)}
.opt.right .key{border-color:var(--on-accent)}
.opt.wrong{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--dot) 6px 9px),var(--panel);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.reveal{display:flex;flex-direction:column;gap:6px;position:relative}
.verdict{font-family:var(--f-display);font-size:26px;text-transform:uppercase;line-height:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.verdict.ok{color:var(--accent)}
.verdict small{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
details.src{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft);line-height:1.5}
details.src summary{cursor:pointer;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.burst{position:absolute;right:10px;top:-22px;font-family:var(--f-display);font-size:30px;letter-spacing:.03em;padding:2px 12px;
  border:var(--border) solid var(--ink);background:var(--panel);transform:rotate(-7deg);pointer-events:none;animation:burst .45s cubic-bezier(.2,1.6,.4,1) both}
.burst.ok{background:var(--accent);color:var(--on-accent)}
@keyframes burst{from{transform:rotate(-7deg) scale(.3);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.shake{animation:shake .32s ease-in-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.splash{background:var(--night);color:var(--night-fg);border:var(--border) solid var(--night);overflow:hidden;padding:18px 16px}
.splash::before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 78% 30%,rgba(255,255,255,.07) 0 5deg,transparent 5deg 12deg);pointer-events:none}
.splash>*{position:relative}
.splash .mast{color:var(--night-fg);font-size:clamp(58px,19vw,96px)}
.splash .mast span{color:var(--accent);display:inline}
.bossart{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:end}
.bossart svg{width:128px;height:150px;display:block;color:var(--night-fg)}
.fp{fill:var(--panel)}.fa{fill:var(--accent)}.sa{stroke:var(--accent)}
.bossart svg .fp{fill:var(--night)}
.splash .balloon{color:#111218;background:#ffffff;border-color:#ffffff;margin-top:6px}
.splash .balloon::after{display:none}
.splash .sit{color:var(--night-soft);font-size:15px}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.check{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border:2px solid var(--night-fg);
  background:transparent;color:var(--night-fg);font-size:15px;line-height:1.4;width:100%}
.check .box{width:24px;height:24px;border:2px solid var(--night-fg);display:grid;place-items:center;font-family:var(--f-display);font-size:16px}
.check.on{background:var(--night-fg);color:#111218}
.check.on .box{background:var(--accent);border-color:var(--accent);color:#ffffff}
.judge{font-family:var(--f-display);font-size:28px;text-transform:uppercase;line-height:1.05;color:var(--accent)}

.big{font-family:var(--f-display);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:28px;color:var(--ink-soft)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.bar .n{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:var(--border) solid var(--ink);background:var(--panel);padding:8px 2px;text-align:center;min-width:0}
.day b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1.05;font-variant-numeric:tabular-nums}
.day .mono{font-size:10px;letter-spacing:0}
.day.today{outline:3px solid var(--accent);outline-offset:2px}
.day.empty b{color:var(--ink-soft)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0}
.list li{list-style:none;border-top:2px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.finding{border-style:dashed}
.badgehit{border-color:var(--accent);border-width:4px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:var(--border) solid var(--ink);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.card .era{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.card b{font-family:var(--f-letter);font-size:15px;line-height:1.2}
.card .by{font-size:13px;color:var(--ink-soft)}
.card .x{position:absolute;right:8px;top:6px;font-family:var(--f-display);font-size:16px}
.card.locked{border-style:dashed;color:var(--ink-soft);display:grid;place-items:center;text-align:center}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{border:var(--border) solid var(--ink);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.badge b{font-family:var(--f-display);font-weight:400;font-size:19px;text-transform:uppercase;line-height:1.05}
.badge span{font-size:13px;color:var(--ink-soft)}
.badge.off{border-style:dashed;opacity:.55}
.badge.on b{color:var(--accent)}
.archive{display:flex;flex-direction:column;gap:8px}
.archive button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px;border:var(--border) solid var(--ink);background:var(--panel)}
.archive .meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:370px){.balloon{font-size:18px}.stat b{font-size:26px}.bar{grid-template-columns:78px 1fr 40px}.speaker{grid-template-columns:54px 1fr}.who svg{width:54px;height:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn:active{transform:none}}
</style>

<script>
/* Webversion ohne Claude: Hefte kommen als JSON-Dateien von der Website, Spielstände bleiben im Browser dieses Handys. */
(function(){
  if (window.claude && typeof window.claude.use === "function") return;
  var KEY = "morgenrunde-web-v1", QKEY = "morgenrunde-web-hefte-v1";
  function load(k){ try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch(e){ return {}; } }
  function save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  var store = load(KEY), quizzes = load(QKEY), listeners = [];
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function all(){ var o = {}; Object.keys(quizzes).forEach(function(d){ o["quizzes/"+d] = quizzes[d]; }); Object.keys(store).forEach(function(p){ o[p] = store[p]; }); return o; }
  function snapDoc(id, d){ return { id: id, exists: d !== undefined, data: function(){ return d === undefined ? undefined : clone(d); }, metadata: { fromCache: false, hasPendingWrites: false } }; }
  function fire(){ listeners.forEach(function(l){ setTimeout(l, 0); }); }
  function query(col, filters){
    var q = {
      where: function(f, op, v){ return query(col, filters.concat([[f, op, v]])); },
      orderBy: function(){ return q; }, limit: function(){ return q; },
      get: function(){ return Promise.resolve(run()); },
      onSnapshot: function(next){ var l = function(){ next(run()); }; listeners.push(l); setTimeout(l, 0); return function(){ listeners = listeners.filter(function(x){ return x !== l; }); }; }
    };
    function run(){ var docs = [], a = all();
      Object.keys(a).sort().forEach(function(p){ var parts = p.split("/"); if (parts.slice(0, -1).join("/") !== col) return; var d = a[p];
        var ok = filters.every(function(f){ var x = d[f[0]]; return f[1] === ">=" ? x >= f[2] : f[1] === "==" ? x === f[2] : true; });
        if (ok) docs.push(snapDoc(parts[parts.length - 1], d)); });
      return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function(){ return []; }, metadata: {} }; }
    return q; }
  var db = {
    collection: function(p){ return query(p, []); },
    doc: function(p){ return {
      set: function(d){ store[p] = clone(d); if (!save(KEY, store)) return Promise.reject({ code: "quota_exceeded" }); fire(); return Promise.resolve(); },
      get: function(){ return Promise.resolve(snapDoc(p.split("/").pop(), all()[p])); },
      onSnapshot: function(next){ var l = function(){ next(snapDoc(p.split("/").pop(), all()[p])); }; listeners.push(l); setTimeout(l, 0); return function(){}; } }; }
  };
  var ready = fetch("hefte/index.json", { cache: "no-store" }).then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(list){ var dates = (list.hefte || []).slice(-45);
      return Promise.all(dates.map(function(d){ if (quizzes[d] && d < (list.heute || "")) return null;
        return fetch("hefte/" + d + ".json", { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(q){ if (q) quizzes[d] = q; }).catch(function(){}); }))
        .then(function(){ save(QKEY, quizzes); }); })
    .catch(function(){ /* Funkloch: zuletzt geladene Hefte aus dem Speicher */ });
  window.claude = { use: function(n){ return n === "db" ? ready.then(function(){ return db; }) : Promise.resolve(null); } };
})();
</script>

  wrap.appendChild(rankPanel()); const grid=h("div",{class:"badges"});
  BADGES.forEach(([id,name,desc])=>{ const got=p.badges&&p.badges[id]; grid.appendChild(h("div",{class:"badge "+(got?"on":"off")},h("b",{class:"hyph"},name),h("span",null,desc),got?h("span",{class:"mono"},"seit "+shortDate(got)):null)); });
  wrap.appendChild(h("section",{class:"panel"},h("h2",{class:"mast",style:"font-size:clamp(36px,11vw,56px)"},"Abzei",h("span",null,"chen")),h("div",{style:"margin-top:12px"},grid)));
  return wrap; }
function viewArchive(){ const wrap=h("div",{class:"stack"}); wrap.appendChild(topbar(h("span",{class:"mono"},"letzte 6 Wochen")));
  const ds=Object.keys(S.quizzes).sort().reverse(); const list=h("div",{class:"archive"});
  if(!ds.length) list.appendChild(h("p",{class:"notice"},"Noch keine Hefte."));
  ds.forEach(d=>{ const q=S.quizzes[d]; const r=S.results[d]; let meta="";
    if(q.status==="frei") meta="frei"; else { const sc=scoreOf(q,r); meta=r&&r.finished?(sc.ok+"/"+sc.total):(d>S.today?"Vorschau":(sc.done?"angefangen":"offen")); }
    list.appendChild(h("button",{"data-date":d,onclick:()=>{ S.date=d; goto("cover"); }},h("span",null,niceDate(d)),h("span",{class:"meta"},meta))); });
  wrap.appendChild(h("section",{class:"panel"},h("h2",{class:"mast",style:"font-size:clamp(40px,12vw,60px)"},"Ar",h("span",null,"chiv")),h("div",{style:"margin-top:12px"},list)));
  return wrap; }

/* ================= Start ================= */
function boot(){ const claude=window.claude;
  if(!claude||typeof claude.use!=="function"){ S.failed="Die Hefte lassen sich gerade nicht laden."; render(); return; }
  claude.use("db").then(db=>{
    if(!db){ S.failed="Speicher nicht verfügbar. Bitte den privaten Modus ausschalten."; render(); return; }
    S.db=db; const since=addDays(S.today,-45); const got={q:0,r:0,v:0,a:0,p:0};
    let late=false;
    const settle=()=>{ if(!S.ready&&got.q&&((got.r&&got.v&&got.a&&got.p)||late)){ S.ready=true; S.slow=false; S.date=pickDate(S.quizzes,S.today); render(); } };
    setTimeout(()=>{ late=true; if(!S.ready){ if(got.q) settle(); else { S.slow=true; render(); } } },8000);
    const onErr=e=>{ if(!S.ready){ S.failed="Laden fehlgeschlagen ("+((e&&e.code)||"unbekannt")+")."; render(); } };
    const mergeRev=(remote,local)=>{ Object.keys(local).forEach(k=>{ const l=local[k]; if(!l) return; if(!remote[k]||(l.rev||0)>=(remote[k].rev||0)) remote[k]=l; }); return remote; };
    db.collection("quizzes").where("date",">=",since).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ const v=d.data(); if(validQuiz(v)) o[v.date]=v; }); S.quizzes=o; got.q=1;
      if(S.ready){ if(!S.date||!o[S.date]) S.date=pickDate(o,S.today); if(S.view==="cover"||S.view==="archive") render(); } else settle(); },onErr);
    db.collection("results").where("date",">=",since).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.date) o[v.date]=Object.assign({answers:{},boss:[]},v); });
      S.results=mergeRev(o,S.results); got.r=1; if(!S.ready) settle(); },onErr);
    db.collection("review").where("done","==",false).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.id) o[v.id]=v; });
      Object.keys(S.reviews).forEach(k=>{ const l=S.reviews[k]; if(!l) return; if(l.done){ delete o[k]; return; } if(!o[k]||(l.rev||0)>=(o[k].rev||0)) o[k]=l; });
      S.reviews=o; got.v=1; if(!S.ready) settle(); },onErr);
    db.collection("album").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.slug&&v.title) o[v.slug]=v; }); S.album=mergeRev(o,S.album); got.a=1; if(!S.ready) settle(); },onErr);
    db.doc("meta/profile").onSnapshot(d=>{ const v=d.exists?d.data():null; if(v&&(!S.profile||(v.rev||0)>(S.profile.rev||0))) S.profile=Object.assign(emptyProfile(),v); got.p=1; if(!S.ready) settle(); },onErr);
  }).catch(()=>{ S.failed="Der Speicher hat nicht geantwortet."; render(); });
  setInterval(()=>{ const t=todayStr(); if(t!==S.today){ S.today=t; if(S.view==="cover"){ S.date=pickDate(S.quizzes,t); render(); } } },60000); }
/* Tastatur am PC: A bis D oder 1 bis 4 antworten, Enter oder Leertaste weiter */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return; const t=e.target; if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)) return;
  const k=e.key.toLowerCase(); const click=sel=>{ const el=document.querySelector(sel); if(el&&!el.disabled){ e.preventDefault(); el.click(); return true; } return false; };
  const pos="abcd".indexOf(k)>=0? "abcd".indexOf(k) : "1234".indexOf(k);
  if(S.view==="play"&&pos>=0){ const b=document.querySelectorAll(".opt")[pos]; if(b&&!b.disabled){ e.preventDefault(); b.click(); } return; }
  if(S.view==="boss"&&pos>=0&&S.bossOpen){ click('.check[data-pt="'+pos+'"]'); return; }
  if(k==="enter"||k===" "||k==="arrowright"){ if(t&&t.tagName==="BUTTON"&&k!=="arrowright") return; click("#next")||click("#bossReveal")||click("#bossDone")||(S.view==="cover"&&click("#start")); }
});
window.MR._state=S; window.MR._render=render;
boot();
})();
</script>
