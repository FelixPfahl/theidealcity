<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="267mm" viewBox="0 0 180 267"><style>text{font-family:Relief,sans-serif} .h{font-family:Duerer1525,serif} .hand{font-family:DuererHand,cursive}</style><text class="h" x="0" y="8" font-size="6.2" fill="#000">ARBEITSBLATT PROPORTION</text><text x="0" y="15.5" font-size="3.4" fill="#000">Proportionslehre: eine Figur aus acht Köpfen, in den Grundlagen leicht erklärt.</text><text x="0" y="24" font-size="3.4" fill="#000" text-anchor="start">1. Miss mit dem Bleistift am ausgestreckten Arm: Wie oft passt der Kopf einer Person in ihre</text><text x="0" y="28.93" font-size="3.4" fill="#000" text-anchor="start">ganze Größe? 2. Teile die Linie rechts in acht gleiche Teile und zeichne eine stehende Figur</text><text x="0" y="33.86" font-size="3.4" fill="#000" text-anchor="start">hinein. 3. Vergleiche mit einem Foto von dir: Wo weicht der Kanon ab, und warum ist er trotzdem</text><text x="0" y="38.79" font-size="3.4" fill="#000" text-anchor="start">nützlich?</text><line x1="110" y1="49.72" x2="180" y2="49.72" stroke="#000" stroke-width="0.5"/><text x="108" y="50.72" font-size="3" fill="#000" text-anchor="end">0</text><line x1="110" y1="74.75" x2="180" y2="74.75" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="75.75" font-size="3" fill="#000" text-anchor="end">1</text><line x1="110" y1="99.79" x2="180" y2="99.79" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="100.79" font-size="3" fill="#000" text-anchor="end">2</text><line x1="110" y1="124.83" x2="180" y2="124.83" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="125.83" font-size="3" fill="#000" text-anchor="end">3</text><line x1="110" y1="149.86" x2="180" y2="149.86" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="150.86" font-size="3" fill="#000" text-anchor="end">4</text><line x1="110" y1="174.89" x2="180" y2="174.89" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="175.89" font-size="3" fill="#000" text-anchor="end">5</text><line x1="110" y1="199.93" x2="180" y2="199.93" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="200.93" font-size="3" fill="#000" text-anchor="end">6</text><line x1="110" y1="224.97" x2="180" y2="224.97" stroke="#9a9a9a" stroke-width="0.25"/><text x="108" y="225.97" font-size="3" fill="#000" text-anchor="end">7</text><line x1="110" y1="250" x2="180" y2="250" stroke="#000" stroke-width="0.5"/><text x="108" y="251" font-size="3" fill="#000" text-anchor="end">8</text><rect x="0" y="49.72" width="100" height="200.28" fill="none" stroke="#000" stroke-width="0.4"/><text x="2" y="54.72" font-size="3" fill="#9a9a9a" text-anchor="start">Messung und Notizen</text><text x="0" y="266" font-family="Relief" font-size="2.6" fill="#000">Josef Knoll · Arbeitsblatt Proportion · CC BY 4.0 · theidealcity.gg/de/musterbuch.html</text></svg>