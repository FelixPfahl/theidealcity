<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="267mm" viewBox="0 0 180 267"><style>text{font-family:Relief,sans-serif} .h{font-family:Duerer1525,serif} .hand{font-family:DuererHand,cursive}</style><text class="h" x="0" y="8" font-size="6.2" fill="#000">ARBEITSBLATT VOM SKRIPT ZUR SEITE</text><text x="0" y="15.5" font-size="3.4" fill="#000">Vier Schritte, wie eine Comicseite entsteht.</text><rect x="0" y="22" width="180" height="54" fill="none" stroke="#000" stroke-width="0.5"/><text x="2" y="27" font-size="3.6" fill="#000" text-anchor="start">1 Skript</text><text x="2" y="32" font-size="3" fill="#9a9a9a" text-anchor="start">Was passiert, Panel für Panel? Wer sagt was?</text><rect x="0" y="80" width="180" height="54" fill="none" stroke="#000" stroke-width="0.5"/><text x="2" y="85" font-size="3.6" fill="#000" text-anchor="start">2 Thumbnails</text><text x="2" y="90" font-size="3" fill="#9a9a9a" text-anchor="start">Ganz klein und schnell: drei Varianten der Seite.</text><rect x="8" y="94" width="34" height="38.46" fill="none" stroke="#000" stroke-width="0.4"/><rect x="66" y="94" width="34" height="38.46" fill="none" stroke="#000" stroke-width="0.4"/><rect x="124" y="94" width="34" height="38.46" fill="none" stroke="#000" stroke-width="0.4"/><rect x="0" y="138" width="180" height="54" fill="none" stroke="#000" stroke-width="0.5"/><text x="2" y="143" font-size="3.6" fill="#000" text-anchor="start">3 Layout</text><text x="2" y="148" font-size="3" fill="#9a9a9a" text-anchor="start">Die beste Variante groß: Panels, Blasen, Blickführung.</text><rect x="0" y="196" width="180" height="54" fill="none" stroke="#000" stroke-width="0.5"/><text x="2" y="201" font-size="3.6" fill="#000" text-anchor="start">4 Reinzeichnung</text><text x="2" y="206" font-size="3" fill="#9a9a9a" text-anchor="start">Erst Bleistift, dann Tusche.</text><text x="0" y="266" font-family="Relief" font-size="2.6" fill="#000">Josef Knoll · Arbeitsblatt Vom Skript zur Seite · CC BY 4.0 · theidealcity.gg/de/musterbuch.html</text></svg>