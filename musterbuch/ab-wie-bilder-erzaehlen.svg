<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="267mm" viewBox="0 0 180 267"><style>text{font-family:Relief,sans-serif} .h{font-family:Duerer1525,serif} .hand{font-family:DuererHand,cursive}</style><text class="h" x="0" y="8" font-size="6.2" fill="#000">ARBEITSBLATT WIE BILDER ERZÄHLEN</text><text x="0" y="15.5" font-size="3.4" fill="#000">Ein Bild befragen: Wer schaut von wo, was darf gezeigt werden, wer wird zur Puppe?</text><rect x="0" y="24" width="180" height="70" fill="none" stroke="#000" stroke-width="0.5"/><text x="2" y="29" font-size="3" fill="#9a9a9a" text-anchor="start">Bild (aufkleben oder skizzieren)</text><text x="0" y="104" font-size="3.2" fill="#000" text-anchor="start">1. Wo stehe ich als Betrachter*in? Von oben, von unten, auf Augenhöhe?</text><line x1="0" y1="112" x2="180" y2="112" stroke="#000" stroke-width="0.25"/><line x1="0" y1="119" x2="180" y2="119" stroke="#000" stroke-width="0.25"/><text x="0" y="129" font-size="3.2" fill="#000" text-anchor="start">2. Wohin führt mich das Bild zuerst, wohin danach? Zeichne den Weg mit Pfeilen ein.</text><line x1="0" y1="137" x2="180" y2="137" stroke="#000" stroke-width="0.25"/><line x1="0" y1="144" x2="180" y2="144" stroke="#000" stroke-width="0.25"/><text x="0" y="154" font-size="3.2" fill="#000" text-anchor="start">3. Was ist ganz zu sehen, was angeschnitten, was fehlt?</text><line x1="0" y1="162" x2="180" y2="162" stroke="#000" stroke-width="0.25"/><line x1="0" y1="169" x2="180" y2="169" stroke="#000" stroke-width="0.25"/><text x="0" y="179" font-size="3.2" fill="#000" text-anchor="start">4. Wer handelt, wer wird angeschaut? Wer schaut zurück?</text><line x1="0" y1="187" x2="180" y2="187" stroke="#000" stroke-width="0.25"/><line x1="0" y1="194" x2="180" y2="194" stroke="#000" stroke-width="0.25"/><text x="0" y="204" font-size="3.2" fill="#000" text-anchor="start">5. Welche Regel steckt im Bild (Perspektive, Proportion, Lesefolge)?</text><line x1="0" y1="212" x2="180" y2="212" stroke="#000" stroke-width="0.25"/><line x1="0" y1="219" x2="180" y2="219" stroke="#000" stroke-width="0.25"/><text x="0" y="229" font-size="3.2" fill="#000" text-anchor="start">6. Übersetze das Bild in eine eigene Szene von heute: Was bleibt, was ändert sich?</text><line x1="0" y1="237" x2="180" y2="237" stroke="#000" stroke-width="0.25"/><line x1="0" y1="244" x2="180" y2="244" stroke="#000" stroke-width="0.25"/><text x="0" y="266" font-family="Relief" font-size="2.6" fill="#000">Josef Knoll · Arbeitsblatt Wie Bilder erzählen · CC BY 4.0 · theidealcity.gg/de/musterbuch.html</text></svg>