<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="267mm" viewBox="0 0 180 267"><style>text{font-family:Relief,sans-serif} .h{font-family:Duerer1525,serif} .hand{font-family:DuererHand,cursive}</style><text class="h" x="0" y="8" font-size="6.2" fill="#000">BEWERTUNGSBOGEN COMICSEITE</text><text x="0" y="15.5" font-size="3.4" fill="#000">30 Punkte: Prozess, Konzept und Umsetzung je ein Drittel.</text><rect x="0" y="22" width="180" height="8" fill="#eee" stroke="#000" stroke-width="0.6"/><text x="2" y="27.6" font-size="3.6" fill="#000" text-anchor="start">Prozess</text><text x="178" y="27.6" font-size="3.6" fill="#000" text-anchor="end">10 Punkte</text><rect x="0" y="30" width="180" height="9" fill="none" stroke="#000" stroke-width="0.3"/><text x="2" y="36" font-size="3.2" fill="#000" text-anchor="start">Skript und Thumbnails liegen vor</text><text x="178" y="36" font-size="3.2" fill="#000" text-anchor="end">___ / 4</text><rect x="0" y="39" width="180" height="9" fill="none" stroke="#000" stroke-width="0.3"/><text x="2" y="45" font-size="3.2" fill="#000" text-anchor="start">Layout mit nachvollziehbarer Lesefolge</text><text x="178" y="45" font-size="3.2" fill="#000" text-anchor="end">___ / 3</text><rect x="0" y="48" width="180" height="9" fill="none" stroke="#000" stroke-width="0.3"/><text x="2" y="54" font-size="3.2" fill="#000" text-anchor="start">Überarbeitung sichtbar</text><text x="178" y="54" font-size="3.2" fill="#000" text-anchor="end">___ / 3</text><rect x="0" y="61" width="180" height="8" fill="#eee" stroke="#000" stroke-width="0.6"/><text x="2" y="66.6" font-size="3.6" fill="#000" text-anchor="start">Konzept</text><text x="178" y="66.6" font-size="3.6" fill="#000" text-anchor="end">10 Punkte</text><rect x="0" y="69" width="180" height="9" fill="none" stroke="#000" stroke-width="0.3"/><text x="2" y="75" font-size="3.2" fill="#000" text-anchor="start">Klare Idee, verständliche Handlung</text><text x="178" y="75" font-size="3.2" fill="#000" text-anc